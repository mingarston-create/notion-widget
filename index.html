<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Прогресс</title><style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
      --purple: #8b5cf6;
      --purple-bg: #ede9fe;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --amber: #fbbf24;
        --amber-bg: #451a03;
        --pill-bg: #2a2a2a;
        --purple: #a78bfa;
        --purple-bg: #2e1065;
      }
    }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:transparent;color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:6px;margin:0}
.dashboard{max-width:1600px;margin:auto;padding:12px 20px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;min-height:calc(100% - 12px);display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-sub);font-weight:700}

.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.card{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:10px 16px;min-width:0;min-height:120px;display:flex;flex-direction:column;gap:6px;transition:background .15s,border-color .15s,box-shadow .15s}
.card:hover{background:var(--tile-bg);border-color:var(--text-sub)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:-4px}
.inbox{--accent:var(--purple);--tint:var(--purple-bg)}.urgent{--accent:var(--red);--tint:var(--red-bg)}.active{--accent:var(--blue);--tint:var(--blue-bg)}.pool{--accent:var(--text-sub);--tint:var(--pill-bg)}.done{--accent:var(--green);--tint:var(--green-bg)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{font-size:24px;line-height:1}
.badge{color:var(--accent);background:var(--tint);font-size:13px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.value-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.number{font-size:clamp(34.2px,3.135vw,41.8px);font-weight:780;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.caption{font-size:13.5px;line-height:1.25;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-bottom{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:4px;min-height:22px}
.card-bottom .caption{flex-shrink:0}
.done-track{display:block;flex:1;min-width:0;height:6px;background:var(--bar-bg);border-radius:99px;overflow:hidden}.done-fill{height:100%;background:var(--green);width:0}
.detail{display:flex;align-items:flex-start;gap:10px;margin-top:10px;padding:8px 16px;border-radius:10px;background:var(--tile-bg);min-height:40px;font-size:15px;line-height:1.5;color:var(--text-sub)}
.detail[hidden]{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--text-sub);flex:none;margin-top:6px}
.context{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid var(--divider)}
.weather-main,.year-pod,.year-top,.year-bar-row{display:flex;align-items:center;gap:12px}
.weather-temp-wrap{display:flex;align-items:baseline;gap:12px}.weather-icon{font-size:22px}.weather-temp{font-size:20px;font-weight:750}.weather-meta,.year-title,.year-left-chip{font-size:13px;color:var(--text-sub)}
.year-pct-big{font-size:20px;font-weight:750}.progress-track{height:7px;width:90px;background:var(--bar-bg);border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--bar-fill)}
@media(max-width:1150px){.cards{gap:10px}.card{padding:10px 12px;min-height:115px}.number{font-size:32px}.badge{font-size:12px}.caption{font-size:12.5px}.context{flex-wrap:wrap}.year-pod{flex-wrap:wrap}}
@media(max-width:850px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){
  body{padding:4px}
  .dashboard{padding:8px 12px;border-radius:14px;min-height:calc(100% - 8px)}
  .heading{margin-bottom:6px}
  .cards{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .cards::-webkit-scrollbar{display:none}
  .card{
    flex:0 0 132px;
    min-width:132px;
    min-height:92px;
    padding:8px 10px;
    gap:4px;
    border-radius:11px;
  }
  .card-top{gap:4px}
  .icon{font-size:18px}
  .badge{font-size:11px;padding:2px 6px;border-radius:6px}
  .number{font-size:25px}
  .caption{font-size:11.5px}
  .card-bottom{min-height:18px;gap:6px;padding-top:2px}
  .done-track{height:5px}
  .detail{font-size:12px;min-height:32px;padding:6px 10px;margin-top:6px}
  .context{margin-top:6px;padding-top:6px;gap:8px}
  .weather-icon{font-size:18px}
  .weather-temp,.year-pct-big{font-size:16px}
  .weather-meta,.year-title,.year-left-chip{font-size:11px}
  .progress-track{height:6px;width:70px}
}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-left:8px;vertical-align:middle;flex:none;cursor:help}.sync-dot[data-state="ok"]{background:#22a06b}.sync-dot[data-state="pending"]{background:#e5a000}.sync-dot[data-state="error"]{background:#e5484d}</style></head><body>
<main class="dashboard">
<header class="heading"><h1>📊 Прогресс<span id="task-sync-status" class="sync-dot" role="status" tabindex="0" aria-label="Загрузка"></span></h1></header>
<section class="cards" aria-label="Показатели задач">
<button type="button" class="card inbox" data-metric="inbox" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">📥</span><span class="badge">Входящие</span></span><span class="number" id="task-inbox">—</span><span class="card-bottom"><span class="caption">На разбор</span></span></button>
<button type="button" class="card urgent" data-metric="urgent" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">🔥</span><span class="badge">Срочно</span></span><span class="number" id="task-burning">—</span><span class="card-bottom"><span class="caption">Сегодня</span></span></button>
<button type="button" class="card active" data-metric="active" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">⚡</span><span class="badge">Фокус</span></span><span class="number" id="task-progress">—</span><span class="card-bottom"><span class="caption">В работе</span></span></button>
<button type="button" class="card pool" data-metric="pool" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">📌</span><span class="badge">Пул</span></span><span class="number" id="task-todo">—</span><span class="card-bottom"><span class="caption">К выполнению</span></span></button>
<button type="button" class="card done" data-metric="done" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">✅</span><span class="badge" id="task-done-sub">0 из 23</span></span><span class="number" id="task-done">0%</span><span class="card-bottom"><span class="caption">Закрыто</span><span class="done-track" aria-hidden="true"><span class="done-fill" id="done-fill" style="display:block"></span></span></span></button>
</section>
<div class="detail" id="metric-detail" hidden role="status" aria-live="polite" aria-atomic="true"><span class="dot" id="detail-dot" aria-hidden="true"></span><p id="detail-text"></p></div>
<footer class="context">
<div class="weather-main"><span class="weather-icon" id="w-icon">⛅</span><div class="weather-temp-wrap"><span class="weather-temp" id="w-temp">—°C</span><span class="weather-meta" id="w-desc">Москва · загрузка</span></div></div>
<div class="year-pod"><div class="year-top"><span class="year-title" id="year-title">Год</span><span class="year-left-chip" id="year-left">— дн. ост.</span></div><div class="year-bar-row"><span class="year-pct-big" id="year-pct">—%</span><div class="progress-track"><div class="progress-fill" id="year-fill"></div></div></div></div>
</footer></main>
<script src="tasks-sync.js?v=live-v1"></script>
<script>
let metrics={inbox:0,urgent:0,active:0,pool:0,done:0,todayTotal:0,pct:0},hasMetrics=false;
function renderMetrics(value){
 const dot=document.getElementById('task-sync-status');dot.dataset.state=value.status;dot.title=value.message;dot.setAttribute('aria-label',value.message);
 if(value.data){metrics=value.data.metrics;hasMetrics=true;}
 for(const [id,key] of [['task-inbox','inbox'],['task-burning','urgent'],['task-progress','active'],['task-todo','pool']])document.getElementById(id).textContent=hasMetrics?metrics[key]:'—';
 document.getElementById('task-done').textContent=hasMetrics?metrics.pct+'%':'—';
 document.getElementById('task-done-sub').textContent=hasMetrics?metrics.done+' из '+metrics.todayTotal:'Загрузка';
 document.getElementById('done-fill').style.width=(hasMetrics?metrics.pct:0)+'%';
 const selected=document.querySelector('[data-metric][aria-pressed="true"]');if(selected)document.getElementById('detail-text').textContent=hasMetrics?explanations[selected.dataset.metric]():'Данные ещё не загружены';
}
const explanations={
inbox:()=> 'Входящие на разбор: '+metrics.inbox+'. Новые материалы, задачи и ссылки, ожидающие сортировки.',
urgent:()=> 'Сегодня: '+metrics.urgent+'. Срочные задачи и долги, требующие внимания в первую очередь.',
active:()=> 'В работе: '+metrics.active+'. Задачи, которые уже начаты и сейчас находятся в процессе.',
pool:()=> 'К выполнению: '+metrics.pool+'. Задачи в очереди — из них можно выбрать следующий шаг.',
done:()=> 'Закрыто сегодня: '+metrics.done+' из '+metrics.todayTotal+' задач ('+metrics.pct+'%).' + (metrics.urgent > 0 ? ' Осталось на сегодня: '+metrics.urgent+'.' : ' Все задачи на сегодня закрыты! 🎉')
};
const colors={inbox:'var(--purple)',urgent:'var(--red)',active:'var(--blue)',pool:'var(--text-sub)',done:'var(--green)'};
document.querySelectorAll('[data-metric]').forEach(button=>button.addEventListener('click',()=>{
const key=button.dataset.metric;
document.querySelectorAll('[data-metric]').forEach(card=>card.setAttribute('aria-pressed',String(card===button)));
document.getElementById('metric-detail').hidden=false;
document.getElementById('detail-text').textContent=hasMetrics?explanations[key]():'Данные ещё не загружены';
document.getElementById('detail-dot').style.background=colors[key];
}));
TaskSync.subscribe(renderMetrics);TaskSync.start();
    // 1. WEATHER LOGIC (Open-Meteo API)
    const WMO = {
      0: { icon: '☀️', text: 'Ясно' },
      1: { icon: '🌤️', text: 'Преим. ясно' },
      2: { icon: '⛅', text: 'Переменная' },
      3: { icon: '☁️', text: 'Пасмурно' },
      45: { icon: '🌫️', text: 'Туман' },
      48: { icon: '🌫️', text: 'Изморозь' },
      51: { icon: '🌦️', text: 'Морось' },
      53: { icon: '🌦️', text: 'Морось' },
      55: { icon: '🌧️', text: 'Морось' },
      61: { icon: '🌧️', text: 'Дождь' },
      63: { icon: '🌧️', text: 'Дождь' },
      65: { icon: '🌧️', text: 'Ливень' },
      71: { icon: '🌨️', text: 'Снег' },
      73: { icon: '🌨️', text: 'Снег' },
      75: { icon: '❄️', text: 'Снегопад' },
      77: { icon: '🌨️', text: 'Крупа' },
      80: { icon: '🌦️', text: 'Ливневый дождь' },
      81: { icon: '🌧️', text: 'Сильный дождь' },
      85: { icon: '🌨️', text: 'Снегопад' },
      95: { icon: '⛈️', text: 'Гроза' }
    };

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const data = await res.json();
        const curr = data.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: '⛅', text: 'Облачно' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '°C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = 'Москва · ' + wInfo.text;

      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 2. DYNAMIC YEAR PROGRESS
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' ГОД';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' дн. ост.';
    }

    loadWeather();
    updateYear();

    setInterval(() => {
      loadWeather();
      updateYear();
    }, 600000);
  </script></body></html>
