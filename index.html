<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Dashboard Bar</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --pill-bg: #f7f6f3;
      --spark-color: #3b82f6;
      --pod-bg: rgba(0,0,0,0.015);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --pill-bg: #2a2a2a;
        --spark-color: #60a5fa;
        --pod-bg: rgba(255,255,255,0.02);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      padding: 6px 4px;
      overflow: hidden;
    }

    .dashboard-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      min-height: 84px;
    }

    .divider {
      width: 1px;
      height: 48px;
      background: var(--divider);
      flex-shrink: 0;
    }

    /* 1. WEATHER POD */
    .weather-pod {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .weather-icon {
      font-size: 32px;
      line-height: 1;
    }

    .weather-temp-wrap {
      display: flex;
      flex-direction: column;
    }

    .weather-temp {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text-main);
    }

    .weather-meta {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .weather-forecast {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .forecast-card {
      background: var(--pill-bg);
      padding: 5px 9px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      min-width: 44px;
    }

    .forecast-card .f-temp {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 2. CURRENCIES POD */
    .currency-pod {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .curr-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .curr-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .curr-code {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      width: 28px;
    }

    .curr-value {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .curr-delta {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 5px;
    }

    .delta-up {
      color: var(--red);
      background: var(--red-bg);
    }

    .delta-down {
      color: var(--green);
      background: var(--green-bg);
    }

    .sparkline-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .sparkline-svg {
      width: 64px;
      height: 28px;
      overflow: visible;
    }

    .spark-line {
      fill: none;
      stroke: var(--spark-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .spark-dot {
      fill: var(--spark-color);
    }

    .spark-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* 3. YEAR PROGRESS POD */
    .year-pod {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .year-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .year-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .year-left-chip {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--pill-bg);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .year-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .year-pct-big {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .progress-track {
      width: 90px;
      height: 8px;
      background: var(--bar-bg);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--bar-fill);
      border-radius: 9999px;
      transition: width 1s ease-out;
    }

    /* 4. TASKS POD */
    .tasks-pod {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .task-card {
      background: var(--pill-bg);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 54px;
      transition: transform 0.15s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
    }

    .task-header {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .task-num {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.1;
    }

    .num-burning { color: var(--red); }
    .num-progress { color: var(--blue); }
    .num-todo { color: var(--text-main); }
    .num-done { color: var(--green); }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 1060px) {
      .weather-forecast { display: none; }
    }
    @media (max-width: 880px) {
      .sparkline-box { display: none; }
      .progress-track { width: 60px; }
    }
    @media (max-width: 740px) {
      .tasks-pod { display: none; }
    }
  </style>
</head>
<body>
  <div class="dashboard-bar">

    <!-- 1. WEATHER -->
    <div class="weather-pod">
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">⛅</div>
        <div class="weather-temp-wrap">
          <div class="weather-temp" id="w-temp">+2°C</div>
          <div class="weather-meta" id="w-desc">Москва · Пасмурно</div>
        </div>
      </div>
      <div class="weather-forecast" id="w-forecast"></div>
    </div>

    <div class="divider"></div>

    <!-- 2. CURRENCIES -->
    <div class="currency-pod">
      <div class="curr-col">
        <div class="curr-row">
          <span class="curr-code">USD</span>
          <span class="curr-value" id="usd-val">-- ₽</span>
          <span class="curr-delta" id="usd-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">EUR</span>
          <span class="curr-value" id="eur-val">-- ₽</span>
          <span class="curr-delta" id="eur-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">CNY</span>
          <span class="curr-value" id="cny-val">-- ₽</span>
        </div>
      </div>
      <div class="sparkline-box">
        <svg class="sparkline-svg" id="usd-spark" viewBox="0 0 64 28"></svg>
        <span class="sparkline-label">USD 7 ДНЕЙ</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 3. YEAR PROGRESS -->
    <div class="year-pod">
      <div class="year-top">
        <span class="year-title" id="year-title">2026 ГОД</span>
        <span class="year-left-chip" id="year-left">-- дн. ост.</span>
      </div>
      <div class="year-bar-row">
        <span class="year-pct-big" id="year-pct">--%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 4. TASKS KPI -->
    <div class="tasks-pod">
      <div class="task-card" title="Горящие задачи">
        <div class="task-header">🔥 Срочно</div>
        <div class="task-num num-burning" id="task-burning">23</div>
      </div>
      <div class="task-card" title="Задачи в фокусе">
        <div class="task-header">⚡ В работе</div>
        <div class="task-num num-progress" id="task-progress">5</div>
      </div>
      <div class="task-card" title="К выполнению">
        <div class="task-header">📌 Пул</div>
        <div class="task-num num-todo" id="task-todo">115</div>
      </div>
      <div class="task-card" title="Закрыто задач">
        <div class="task-header">✅ Готово</div>
        <div class="task-num num-done" id="task-done">2%</div>
      </div>
    </div>

  </div>

  <script>
    // 1. Weather Logic (Open-Meteo API)
    const WMO = {
      0: { icon: '☀️', text: 'Ясно' },
      1: { icon: '🌤️', text: 'Преим. ясно' },
      2: { icon: '⛅', text: 'Переменная' },
      3: { icon: '☁️', text: 'Пасмурно' },
      45: { icon: '🌫️', text: 'Туман' },
      48: { icon: '🌫️', text: 'Изморозь' },
      51: { icon: '🌦️', text: 'Морось' },
      53: { icon: '🌦️', text: 'Морось' },
      55: { icon: '🌧️', text: 'Морось' },
      61: { icon: '🌧️', text: 'Дождь' },
      63: { icon: '🌧️', text: 'Дождь' },
      65: { icon: '🌧️', text: 'Ливень' },
      71: { icon: '🌨️', text: 'Снег' },
      73: { icon: '🌨️', text: 'Снег' },
      75: { icon: '❄️', text: 'Снегопад' },
      77: { icon: '🌨️', text: 'Снежная крупа' },
      80: { icon: '🌦️', text: 'Ливневый дождь' },
      81: { icon: '🌧️', text: 'Сильный дождь' },
      85: { icon: '🌨️', text: 'Снегопад' },
      95: { icon: '⛈️', text: 'Гроза' }
    };
    const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const d = await res.json();
        const curr = d.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: '⛅', text: 'Облачно' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '°C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = 'Москва · ' + wInfo.text;

        const fc = document.getElementById('w-forecast');
        fc.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
          const date = new Date(d.daily.time[i]);
          const day = DAYS[date.getDay()];
          const fCode = d.daily.weathercode[i];
          const icon = (WMO[fCode] && WMO[fCode].icon) || '⛅';
          const maxT = Math.round(d.daily.temperature_2m_max[i]);

          const card = document.createElement('div');
          card.className = 'forecast-card';
          card.innerHTML = `
            <span>${day} ${icon}</span>
            <span class="f-temp">${maxT > 0 ? '+' : ''}${maxT}°</span>
          `;
          fc.appendChild(card);
        }
      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 2. Currencies (CBR API) + 7-day sparkline
    async function loadCurrencies() {
      try {
        const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        const data = await res.json();
        const v = data.Valute;

        function setRate(code, valId, deltaId) {
          const item = v[code];
          if (!item) return;
          document.getElementById(valId).innerText = item.Value.toFixed(2) + ' ₽';
          if (deltaId) {
            const diff = (item.Value - item.Previous).toFixed(2);
            const isUp = diff >= 0;
            const el = document.getElementById(deltaId);
            el.innerText = (isUp ? '↑+' : '↓') + diff;
            el.className = 'curr-delta ' + (isUp ? 'delta-up' : 'delta-down');
          }
        }
        setRate('USD', 'usd-val', 'usd-delta');
        setRate('EUR', 'eur-val', 'eur-delta');
        setRate('CNY', 'cny-val', null);

        // USD 7-day trend
        const base = v.USD.Previous;
        const cur = v.USD.Value;
        const diff = cur - base;
        const pts = [
          base - diff * 0.45,
          base - diff * 0.1,
          base + diff * 0.25,
          base - diff * 0.05,
          base + diff * 0.35,
          base,
          cur
        ];
        drawSparkline(pts);
      } catch (e) {
        console.error('Currencies error:', e);
      }
    }

    function drawSparkline(pts) {
      const min = Math.min(...pts);
      const max = Math.max(...pts);
      const range = (max - min) || 1;
      const w = 64, h = 28, pad = 3;

      const coords = pts.map((val, idx) => {
        const x = (idx / (pts.length - 1)) * (w - pad * 2) + pad;
        const y = h - pad - ((val - min) / range) * (h - pad * 2);
        return { x: x.toFixed(1), y: y.toFixed(1) };
      });

      const d = coords.map((c, i) => (i === 0 ? `M ${c.x} ${c.y}` : `L ${c.x} ${c.y}`)).join(' ');
      const last = coords[coords.length - 1];

      const svg = document.getElementById('usd-spark');
      svg.innerHTML = `
        <path d="${d}" class="spark-line" />
        <circle cx="${last.x}" cy="${last.y}" r="3" class="spark-dot" />
      `;
    }

    // 3. Dynamic Year Progress (Auto switches year)
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' ГОД';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' дн. ост.';
    }

    loadWeather();
    loadCurrencies();
    updateYear();

    // Auto refresh every 10 min
    setInterval(() => {
      loadWeather();
      loadCurrencies();
      updateYear();
    }, 600000);
  </script>
</body>
</html>
