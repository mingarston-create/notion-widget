<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Dashboard Bar</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --amber: #fbbf24;
        --amber-bg: #451a03;
        --pill-bg: #2a2a2a;
      }
    }


    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; padding: 8px; color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .dashboard-bar {
      --gap: 24px;
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 24px; padding: var(--gap); min-height: 240px;
      display: grid; grid-template-columns: minmax(220px, 1.2fr) minmax(190px, 1fr) minmax(180px, 1fr) minmax(560px, 3fr);
      gap: var(--gap); align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.035);
    }
    .divider { display: none; }
    .weather-pod, .year-pod, .curr-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .weather-main { display: flex; align-items: center; gap: 12px; }
    .weather-icon { font-size: 40px; line-height: 1; }
    .weather-temp { font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
    .weather-meta { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-top: 8px; }
    .weather-forecast { display: flex; gap: 8px; }
    .forecast-card { display: flex; flex: 1; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px; background: var(--pill-bg); border-radius: 12px; font-size: 14px; color: var(--text-sub); font-weight: 600; }
    .f-temp { font-size: 18px; color: var(--text-main); font-weight: 700; }
    .curr-row { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; align-items: center; gap: 8px; }
    .curr-code { font-size: 13px; font-weight: 700; color: var(--text-sub); }
    .curr-value { font-size: 18px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .curr-delta { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 4px; white-space: nowrap; }
    .delta-up { color: var(--red); background: var(--red-bg); }
    .delta-down { color: var(--green); background: var(--green-bg); }
    .year-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
    .year-title { font-size: 14px; font-weight: 700; color: var(--text-sub); letter-spacing: .04em; }
    .year-left-chip { font-size: 12px; color: var(--text-sub); background: var(--pill-bg); border-radius: 6px; padding: 4px 8px; white-space: nowrap; }
    .year-bar-row { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
    .year-pct-big { font-size: 32px; font-weight: 800; line-height: 1.1; letter-spacing: -.03em; }
    .progress-track { width: 100%; height: 10px; border-radius: 999px; background: var(--bar-bg); overflow: hidden; }
    .progress-fill { height: 100%; background: var(--bar-fill); border-radius: inherit; transition: width 1s ease-out; }
    .tasks-hero { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 16px; min-width: 0; align-self: stretch; }
    .task-hero-card { display: flex; flex-direction: column; justify-content: center; gap: 16px; min-width: 0; min-height: 192px; padding: 20px 16px; border: 1px solid var(--card-border); border-radius: 18px; background: var(--tile-bg); }
    .task-hero-card:nth-child(1) { background: var(--red-bg); border-color: transparent; }
    .task-hero-card:nth-child(2) { background: var(--blue-bg); border-color: transparent; }
    .task-hero-card:nth-child(4) { background: var(--green-bg); border-color: transparent; }
    .task-hero-header { min-height: 24px; }
    .task-hero-label { font-size: 16px; font-weight: 650; line-height: 1.5; white-space: nowrap; }
    .task-hero-badge { display: none; }
    .task-hero-num { font-size: clamp(40px, 3.6vw, 64px); line-height: 1; font-weight: 800; letter-spacing: -.045em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .task-hero-sub { font-size: 14px; line-height: 1.5; color: var(--text-main); opacity: .75; }
    .num-burning { color: var(--red); }
    .num-progress { color: var(--blue); }
    .num-todo { color: var(--text-main); }
    .num-done { color: var(--green); }
    @media (max-width: 1279px) {
      .dashboard-bar { grid-template-columns: repeat(3,minmax(0,1fr)); }
      .tasks-hero { grid-column: 1 / -1; }
      .task-hero-num { font-size: 56px; }
    }
    @media (max-width: 679px) {
      .dashboard-bar { --gap: 16px; grid-template-columns: minmax(0,1fr); border-radius: 20px; }
      .tasks-hero { grid-row: 1; grid-template-columns: repeat(2,minmax(0,1fr)); }
      .task-hero-card { min-height: 176px; padding: 16px; }
      .task-hero-num { font-size: 48px; }
      .task-hero-label { font-size: 15px; }
      .weather-pod, .currency-pod, .year-pod { padding-top: 16px; border-top: 1px solid var(--divider); }
      .weather-forecast { max-width: 280px; }
    }
    @media (prefers-reduced-motion: reduce) { .progress-fill { transition: none; } }
  </style>
</head>
<body>
  <div class="dashboard-bar">

    <!-- 1. WEATHER (Компактный) -->
    <div class="weather-pod">
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">⛅</div>
        <div class="weather-temp-wrap">
          <div class="weather-temp" id="w-temp">+3°C</div>
          <div class="weather-meta" id="w-desc">Москва · Дождь</div>
        </div>
      </div>
      <div class="weather-forecast" id="w-forecast"></div>
    </div>

    <div class="divider"></div>

    <!-- 2. CURRENCIES (Компактный) -->
    <div class="currency-pod">
      <div class="curr-col">
        <div class="curr-row">
          <span class="curr-code">USD</span>
          <span class="curr-value" id="usd-val">-- ₽</span>
          <span class="curr-delta" id="usd-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">EUR</span>
          <span class="curr-value" id="eur-val">-- ₽</span>
          <span class="curr-delta" id="eur-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">CNY</span>
          <span class="curr-value" id="cny-val">-- ₽</span>
          <span class="curr-delta" id="cny-delta"></span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 3. YEAR PROGRESS (Компактный) -->
    <div class="year-pod">
      <div class="year-top">
        <span class="year-title" id="year-title">2026 ГОД</span>
        <span class="year-left-chip" id="year-left">-- дн. ост.</span>
      </div>
      <div class="year-bar-row">
        <span class="year-pct-big" id="year-pct">--%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 4. TASKS HERO (ГЛАВНЫЙ РАЗДЕЛ - Высокий, просторный, солидный) -->
    <div class="tasks-hero">

      <div class="task-hero-card" title="Задачи с дедлайном и просроченные">
        <div class="task-hero-header">
          <span class="task-hero-label">🔥 Срочно</span>
          <span class="task-hero-badge badge-burning">Дедлайн</span>
        </div>
        <div class="task-hero-num num-burning" id="task-burning">24</div>
        <div class="task-hero-sub">просрочено</div>
      </div>

      <div class="task-hero-card" title="Задачи в текущей работе">
        <div class="task-hero-header">
          <span class="task-hero-label">⚡ В работе</span>
          <span class="task-hero-badge badge-progress">Фокус</span>
        </div>
        <div class="task-hero-num num-progress" id="task-progress">6</div>
        <div class="task-hero-sub">в процессе</div>
      </div>

      <div class="task-hero-card" title="Задачи в бэклоге и пуле">
        <div class="task-hero-header">
          <span class="task-hero-label">📌 К сдаче</span>
          <span class="task-hero-badge badge-todo">Пул</span>
        </div>
        <div class="task-hero-num num-todo" id="task-todo">114</div>
        <div class="task-hero-sub">в очереди</div>
      </div>

      <div class="task-hero-card" title="Выполненные задачи">
        <div class="task-hero-header">
          <span class="task-hero-label">✅ Готово</span>
          <span class="task-hero-badge badge-done">Успех</span>
        </div>
        <div class="task-hero-num num-done" id="task-done">3</div>
        <div class="task-hero-sub" id="task-done-sub">2% выполнено</div>
      </div>

    </div>

  </div>

  <script>
    // 0. URL PARAMS FOR TASK METRICS
    const params = new URLSearchParams(window.location.search);
    const b = params.get('b');
    const p = params.get('p');
    const t = params.get('t');
    const d = params.get('d');
    const pct = params.get('pct');

    if (b) document.getElementById('task-burning').innerText = b;
    if (p) document.getElementById('task-progress').innerText = p;
    if (t) document.getElementById('task-todo').innerText = t;
    if (pct !== null) document.getElementById('task-done-sub').innerText = pct + '% выполнено';
    if (d !== null) document.getElementById('task-done').innerText = d;

    // 1. WEATHER LOGIC (Open-Meteo API)
    const WMO = {
      0: { icon: '☀️', text: 'Ясно' },
      1: { icon: '🌤️', text: 'Преим. ясно' },
      2: { icon: '⛅', text: 'Переменная' },
      3: { icon: '☁️', text: 'Пасмурно' },
      45: { icon: '🌫️', text: 'Туман' },
      48: { icon: '🌫️', text: 'Изморозь' },
      51: { icon: '🌦️', text: 'Морось' },
      53: { icon: '🌦️', text: 'Морось' },
      55: { icon: '🌧️', text: 'Морось' },
      61: { icon: '🌧️', text: 'Дождь' },
      63: { icon: '🌧️', text: 'Дождь' },
      65: { icon: '🌧️', text: 'Ливень' },
      71: { icon: '🌨️', text: 'Снег' },
      73: { icon: '🌨️', text: 'Снег' },
      75: { icon: '❄️', text: 'Снегопад' },
      77: { icon: '🌨️', text: 'Крупа' },
      80: { icon: '🌦️', text: 'Ливневый дождь' },
      81: { icon: '🌧️', text: 'Сильный дождь' },
      85: { icon: '🌨️', text: 'Снегопад' },
      95: { icon: '⛈️', text: 'Гроза' }
    };
    const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const data = await res.json();
        const curr = data.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: '⛅', text: 'Облачно' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '°C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = 'Москва · ' + wInfo.text;

        const fc = document.getElementById('w-forecast');
        fc.innerHTML = '';
        for (let i = 1; i <= 2; i++) {
          const date = new Date(data.daily.time[i]);
          const day = DAYS[date.getDay()];
          const fCode = data.daily.weathercode[i];
          const icon = (WMO[fCode] && WMO[fCode].icon) || '⛅';
          const maxT = Math.round(data.daily.temperature_2m_max[i]);

          const card = document.createElement('div');
          card.className = 'forecast-card';
          card.innerHTML = `
            <span>${day} ${icon}</span>
            <span class="f-temp">${maxT > 0 ? '+' : ''}${maxT}°</span>
          `;
          fc.appendChild(card);
        }
      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 2. CURRENCIES (ЦБ РФ API)
    async function loadCurrencies() {
      try {
        const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        const data = await res.json();
        const v = data.Valute;

        function setRate(code, valId, deltaId) {
          const item = v[code];
          if (!item) return;
          document.getElementById(valId).innerText = item.Value.toFixed(2) + ' ₽';
          if (deltaId) {
            const diff = (item.Value - item.Previous).toFixed(2);
            const isUp = diff >= 0;
            const el = document.getElementById(deltaId);
            el.innerText = (isUp ? '↑+' : '↓') + diff;
            el.className = 'curr-delta ' + (isUp ? 'delta-up' : 'delta-down');
          }
        }
        setRate('USD', 'usd-val', 'usd-delta');
        setRate('EUR', 'eur-val', 'eur-delta');
        setRate('CNY', 'cny-val', 'cny-delta');
      } catch (e) {
        console.error('Currencies error:', e);
      }
    }

    // 3. DYNAMIC YEAR PROGRESS
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' ГОД';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' дн. ост.';
    }

    loadWeather();
    loadCurrencies();
    updateYear();

    setInterval(() => {
      loadWeather();
      loadCurrencies();
      updateYear();
    }, 600000);
  </script>
</body>
</html>
