<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Dashboard Bar</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --pill-bg: #2a2a2a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      padding: 3px 1px;
      overflow: hidden;
    }

    .dashboard-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 100%;
      margin: 0 auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      min-height: 72px;
    }

    .divider {
      width: 1px;
      height: 38px;
      background: var(--divider);
      flex-shrink: 0;
    }

    /* 1. WEATHER POD */
    .weather-pod {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .weather-icon {
      font-size: 26px;
      line-height: 1;
    }

    .weather-temp-wrap {
      display: flex;
      flex-direction: column;
    }

    .weather-temp {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text-main);
    }

    .weather-meta {
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 600;
      white-space: nowrap;
    }

    .weather-forecast {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .forecast-card {
      background: var(--pill-bg);
      padding: 3px 6px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-sub);
      min-width: 34px;
    }

    .forecast-card .f-temp {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 2. CURRENCIES POD */
    .currency-pod {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .curr-col {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .curr-row {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      line-height: 1.2;
    }

    .curr-code {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-sub);
      width: 22px;
    }

    .curr-value {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-main);
      min-width: 44px;
    }

    .curr-delta {
      font-size: 9px;
      font-weight: 700;
      padding: 0px 3px;
      border-radius: 3px;
    }

    .delta-up {
      color: var(--red);
      background: var(--red-bg);
    }

    .delta-down {
      color: var(--green);
      background: var(--green-bg);
    }

    /* 3. YEAR PROGRESS POD */
    .year-pod {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .year-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .year-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .year-left-chip {
      font-size: 9px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--pill-bg);
      padding: 1px 4px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .year-bar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .year-pct-big {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
    }

    .progress-track {
      width: 55px;
      height: 7px;
      background: var(--bar-bg);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--bar-fill);
      border-radius: 9999px;
      transition: width 1s ease-out;
    }

    /* 4. TASKS POD */
    .tasks-pod {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .task-card {
      background: var(--pill-bg);
      border-radius: 8px;
      padding: 4px 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 44px;
      transition: transform 0.15s ease;
    }

    .task-card:hover {
      transform: translateY(-1px);
    }

    .task-header {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
    }

    .task-num {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.1;
    }

    .num-burning { color: var(--red); }
    .num-progress { color: var(--blue); }
    .num-todo { color: var(--text-main); }
    .num-done { color: var(--green); }
  </style>
</head>
<body>
  <div class="dashboard-bar">

    <!-- 1. WEATHER -->
    <div class="weather-pod">
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">⛅</div>
        <div class="weather-temp-wrap">
          <div class="weather-temp" id="w-temp">+2°C</div>
          <div class="weather-meta" id="w-desc">Москва · Пасмурно</div>
        </div>
      </div>
      <div class="weather-forecast" id="w-forecast"></div>
    </div>

    <div class="divider"></div>

    <!-- 2. CURRENCIES (Без графика USD 7 ДНЕЙ) -->
    <div class="currency-pod">
      <div class="curr-col">
        <div class="curr-row">
          <span class="curr-code">USD</span>
          <span class="curr-value" id="usd-val">-- ₽</span>
          <span class="curr-delta" id="usd-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">EUR</span>
          <span class="curr-value" id="eur-val">-- ₽</span>
          <span class="curr-delta" id="eur-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">CNY</span>
          <span class="curr-value" id="cny-val">-- ₽</span>
          <span class="curr-delta" id="cny-delta"></span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 3. YEAR PROGRESS -->
    <div class="year-pod">
      <div class="year-top">
        <span class="year-title" id="year-title">2026 ГОД</span>
        <span class="year-left-chip" id="year-left">-- дн. ост.</span>
      </div>
      <div class="year-bar-row">
        <span class="year-pct-big" id="year-pct">--%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 4. TASKS KPI -->
    <div class="tasks-pod">
      <div class="task-card" title="Срочные / просроченные задачи">
        <div class="task-header">🔥 Срочно</div>
        <div class="task-num num-burning" id="task-burning">24</div>
      </div>
      <div class="task-card" title="Задачи в работе">
        <div class="task-header">⚡ В работе</div>
        <div class="task-num num-progress" id="task-progress">6</div>
      </div>
      <div class="task-card" title="К сдаче / в бэклоге">
        <div class="task-header">📌 Пул</div>
        <div class="task-num num-todo" id="task-todo">114</div>
      </div>
      <div class="task-card" title="Закрыто задач">
        <div class="task-header">✅ Готово</div>
        <div class="task-num num-done" id="task-done">2%</div>
      </div>
    </div>

  </div>

  <script>
    // 0. URL PARAMS FOR TASK METRICS
    const params = new URLSearchParams(window.location.search);
    const b = params.get('b');
    const p = params.get('p');
    const t = params.get('t');
    const pct = params.get('pct');

    if (b) document.getElementById('task-burning').innerText = b;
    if (p) document.getElementById('task-progress').innerText = p;
    if (t) document.getElementById('task-todo').innerText = t;
    if (pct) document.getElementById('task-done').innerText = pct + '%';

    // 1. WEATHER LOGIC (Open-Meteo API)
    const WMO = {
      0: { icon: '☀️', text: 'Ясно' },
      1: { icon: '🌤️', text: 'Преим. ясно' },
      2: { icon: '⛅', text: 'Переменная' },
      3: { icon: '☁️', text: 'Пасмурно' },
      45: { icon: '🌫️', text: 'Туман' },
      48: { icon: '🌫️', text: 'Изморозь' },
      51: { icon: '🌦️', text: 'Морось' },
      53: { icon: '🌦️', text: 'Морось' },
      55: { icon: '🌧️', text: 'Морось' },
      61: { icon: '🌧️', text: 'Дождь' },
      63: { icon: '🌧️', text: 'Дождь' },
      65: { icon: '🌧️', text: 'Ливень' },
      71: { icon: '🌨️', text: 'Снег' },
      73: { icon: '🌨️', text: 'Снег' },
      75: { icon: '❄️', text: 'Снегопад' },
      77: { icon: '🌨️', text: 'Крупа' },
      80: { icon: '🌦️', text: 'Ливневый дождь' },
      81: { icon: '🌧️', text: 'Сильный дождь' },
      85: { icon: '🌨️', text: 'Снегопад' },
      95: { icon: '⛈️', text: 'Гроза' }
    };
    const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const data = await res.json();
        const curr = data.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: '⛅', text: 'Облачно' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '°C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = 'Москва · ' + wInfo.text;

        const fc = document.getElementById('w-forecast');
        fc.innerHTML = '';
        for (let i = 1; i <= 2; i++) {
          const date = new Date(data.daily.time[i]);
          const day = DAYS[date.getDay()];
          const fCode = data.daily.weathercode[i];
          const icon = (WMO[fCode] && WMO[fCode].icon) || '⛅';
          const maxT = Math.round(data.daily.temperature_2m_max[i]);

          const card = document.createElement('div');
          card.className = 'forecast-card';
          card.innerHTML = `
            <span>${day} ${icon}</span>
            <span class="f-temp">${maxT > 0 ? '+' : ''}${maxT}°</span>
          `;
          fc.appendChild(card);
        }
      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 2. CURRENCIES (ЦБ РФ API)
    async function loadCurrencies() {
      try {
        const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        const data = await res.json();
        const v = data.Valute;

        function setRate(code, valId, deltaId) {
          const item = v[code];
          if (!item) return;
          document.getElementById(valId).innerText = item.Value.toFixed(2) + ' ₽';
          if (deltaId) {
            const diff = (item.Value - item.Previous).toFixed(2);
            const isUp = diff >= 0;
            const el = document.getElementById(deltaId);
            el.innerText = (isUp ? '↑+' : '↓') + diff;
            el.className = 'curr-delta ' + (isUp ? 'delta-up' : 'delta-down');
          }
        }
        setRate('USD', 'usd-val', 'usd-delta');
        setRate('EUR', 'eur-val', 'eur-delta');
        setRate('CNY', 'cny-val', 'cny-delta');
      } catch (e) {
        console.error('Currencies error:', e);
      }
    }

    // 3. DYNAMIC YEAR PROGRESS
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' ГОД';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' дн. ост.';
    }

    loadWeather();
    loadCurrencies();
    updateYear();

    setInterval(() => {
      loadWeather();
      loadCurrencies();
      updateYear();
    }, 600000);
  </script>
</body>
</html>
