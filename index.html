<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Dashboard Bar</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --pill-bg: #2a2a2a;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background: transparent;
      padding: 4px 2px;
      overflow: hidden;
    }

    .dashboard-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      max-width: 1400px;
      margin: 0 auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      min-height: 80px;
    }

    .divider {
      width: 1px;
      height: 44px;
      background: var(--divider);
      flex-shrink: 0;
    }

    /* 1. WEATHER POD */
    .weather-pod {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .weather-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .weather-icon {
      font-size: 32px;
      line-height: 1;
    }

    .weather-temp-wrap {
      display: flex;
      flex-direction: column;
    }

    .weather-temp {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--text-main);
    }

    .weather-meta {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      white-space: nowrap;
    }

    .weather-forecast {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .forecast-card {
      background: var(--pill-bg);
      padding: 4px 8px;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      min-width: 42px;
    }

    .forecast-card .f-temp {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 2. CURRENCIES POD (–С–µ–Ј –≥—А–∞—Д–Є–Ї–∞, —В–Њ–ї—М–Ї–Њ –Ї—Г—А—Б—Л –Є –і–µ–ї—М—В—Л) */
    .currency-pod {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .curr-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .curr-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      line-height: 1.2;
    }

    .curr-code {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
      width: 26px;
    }

    .curr-value {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
      min-width: 52px;
    }

    .curr-delta {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 4px;
    }

    .delta-up {
      color: var(--red);
      background: var(--red-bg);
    }

    .delta-down {
      color: var(--green);
      background: var(--green-bg);
    }

    /* 3. YEAR PROGRESS POD */
    .year-pod {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-shrink: 0;
      min-width: 140px;
    }

    .year-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .year-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .year-left-chip {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--pill-bg);
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .year-bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .year-pct-big {
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
      min-width: 46px;
    }

    .progress-track {
      flex: 1;
      min-width: 70px;
      height: 8px;
      background: var(--bar-bg);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--bar-fill);
      border-radius: 9999px;
      transition: width 1s ease-out;
    }

    /* 4. TASKS POD */
    .tasks-pod {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .task-card {
      background: var(--pill-bg);
      border-radius: 9px;
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 52px;
      transition: transform 0.15s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);
    }

    .task-header {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .task-num {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.1;
    }

    .num-burning { color: var(--red); }
    .num-progress { color: var(--blue); }
    .num-todo { color: var(--text-main); }
    .num-done { color: var(--green); }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 1020px) {
      .weather-forecast { display: none; }
    }
    @media (max-width: 780px) {
      .currency-pod { display: none; }
      .divider:nth-of-type(2) { display: none; }
    }
  </style>
</head>
<body>
  <div class="dashboard-bar">

    <!-- 1. WEATHER -->
    <div class="weather-pod">
      <div class="weather-main">
        <div class="weather-icon" id="w-icon">вЫЕ</div>
        <div class="weather-temp-wrap">
          <div class="weather-temp" id="w-temp">+2¬∞C</div>
          <div class="weather-meta" id="w-desc">–Ь–Њ—Б–Ї–≤–∞ ¬Ј –Я–∞—Б–Љ—Г—А–љ–Њ</div>
        </div>
      </div>
      <div class="weather-forecast" id="w-forecast"></div>
    </div>

    <div class="divider"></div>

    <!-- 2. CURRENCIES (–С–µ–Ј –≥—А–∞—Д–Є–Ї–∞ USD 7 –Ф–Э–Х–Щ) -->
    <div class="currency-pod">
      <div class="curr-col">
        <div class="curr-row">
          <span class="curr-code">USD</span>
          <span class="curr-value" id="usd-val">-- вВљ</span>
          <span class="curr-delta" id="usd-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">EUR</span>
          <span class="curr-value" id="eur-val">-- вВљ</span>
          <span class="curr-delta" id="eur-delta"></span>
        </div>
        <div class="curr-row">
          <span class="curr-code">CNY</span>
          <span class="curr-value" id="cny-val">-- вВљ</span>
          <span class="curr-delta" id="cny-delta"></span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 3. YEAR PROGRESS -->
    <div class="year-pod">
      <div class="year-top">
        <span class="year-title" id="year-title">2026 –У–Ю–Ф</span>
        <span class="year-left-chip" id="year-left">-- –і–љ. –Њ—Б—В.</span>
      </div>
      <div class="year-bar-row">
        <span class="year-pct-big" id="year-pct">--%</span>
        <div class="progress-track">
          <div class="progress-fill" id="year-fill" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 4. TASKS KPI -->
    <div class="tasks-pod">
      <div class="task-card" title="–°—А–Њ—З–љ—Л–µ / –њ—А–Њ—Б—А–Њ—З–µ–љ–љ—Л–µ –Ј–∞–і–∞—З–Є">
        <div class="task-header">рЯФ• –°—А–Њ—З–љ–Њ</div>
        <div class="task-num num-burning" id="task-burning">24</div>
      </div>
      <div class="task-card" title="–Ч–∞–і–∞—З–Є –≤ —А–∞–±–Њ—В–µ">
        <div class="task-header">вЪ° –Т —А–∞–±–Њ—В–µ</div>
        <div class="task-num num-progress" id="task-progress">6</div>
      </div>
      <div class="task-card" title="–Ъ —Б–і–∞—З–µ / –≤ –±—Н–Ї–ї–Њ–≥–µ">
        <div class="task-header">рЯУМ –Я—Г–ї</div>
        <div class="task-num num-todo" id="task-todo">114</div>
      </div>
      <div class="task-card" title="–Ч–∞–Ї—А—Л—В–Њ –Ј–∞–і–∞—З">
        <div class="task-header">вЬЕ –У–Њ—В–Њ–≤–Њ</div>
        <div class="task-num num-done" id="task-done">2%</div>
      </div>
    </div>

  </div>

  <script>
    // 0. URL PARAMS FOR TASK METRICS
    const params = new URLSearchParams(window.location.search);
    const b = params.get('b');
    const p = params.get('p');
    const t = params.get('t');
    const pct = params.get('pct');

    if (b) document.getElementById('task-burning').innerText = b;
    if (p) document.getElementById('task-progress').innerText = p;
    if (t) document.getElementById('task-todo').innerText = t;
    if (pct) document.getElementById('task-done').innerText = pct + '%';

    // 1. WEATHER LOGIC (Open-Meteo API)
    const WMO = {
      0: { icon: 'вШАпЄП', text: '–ѓ—Б–љ–Њ' },
      1: { icon: 'рЯМ§пЄП', text: '–Я—А–µ–Є–Љ. —П—Б–љ–Њ' },
      2: { icon: 'вЫЕ', text: '–Я–µ—А–µ–Љ–µ–љ–љ–∞—П' },
      3: { icon: 'вШБпЄП', text: '–Я–∞—Б–Љ—Г—А–љ–Њ' },
      45: { icon: 'рЯМЂпЄП', text: '–Ґ—Г–Љ–∞–љ' },
      48: { icon: 'рЯМЂпЄП', text: '–Ш–Ј–Љ–Њ—А–Њ–Ј—М' },
      51: { icon: 'рЯМ¶пЄП', text: '–Ь–Њ—А–Њ—Б—М' },
      53: { icon: 'рЯМ¶пЄП', text: '–Ь–Њ—А–Њ—Б—М' },
      55: { icon: 'рЯМІпЄП', text: '–Ь–Њ—А–Њ—Б—М' },
      61: { icon: 'рЯМІпЄП', text: '–Ф–Њ–ґ–і—М' },
      63: { icon: 'рЯМІпЄП', text: '–Ф–Њ–ґ–і—М' },
      65: { icon: 'рЯМІпЄП', text: '–Ы–Є–≤–µ–љ—М' },
      71: { icon: 'рЯМ®пЄП', text: '–°–љ–µ–≥' },
      73: { icon: 'рЯМ®пЄП', text: '–°–љ–µ–≥' },
      75: { icon: 'вЭДпЄП', text: '–°–љ–µ–≥–Њ–њ–∞–і' },
      77: { icon: 'рЯМ®пЄП', text: '–Ъ—А—Г–њ–∞' },
      80: { icon: 'рЯМ¶пЄП', text: '–Ы–Є–≤–љ–µ–≤—Л–є –і–Њ–ґ–і—М' },
      81: { icon: 'рЯМІпЄП', text: '–°–Є–ї—М–љ—Л–є –і–Њ–ґ–і—М' },
      85: { icon: 'рЯМ®пЄП', text: '–°–љ–µ–≥–Њ–њ–∞–і' },
      95: { icon: 'вЫИпЄП', text: '–У—А–Њ–Ј–∞' }
    };
    const DAYS = ['–Т—Б', '–Я–љ', '–Т—В', '–°—А', '–І—В', '–Я—В', '–°–±'];

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const data = await res.json();
        const curr = data.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: 'вЫЕ', text: '–Ю–±–ї–∞—З–љ–Њ' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '¬∞C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = '–Ь–Њ—Б–Ї–≤–∞ ¬Ј ' + wInfo.text;

        const fc = document.getElementById('w-forecast');
        fc.innerHTML = '';
        for (let i = 1; i <= 3; i++) {
          const date = new Date(data.daily.time[i]);
          const day = DAYS[date.getDay()];
          const fCode = data.daily.weathercode[i];
          const icon = (WMO[fCode] && WMO[fCode].icon) || 'вЫЕ';
          const maxT = Math.round(data.daily.temperature_2m_max[i]);

          const card = document.createElement('div');
          card.className = 'forecast-card';
          card.innerHTML = `
            <span>${day} ${icon}</span>
            <span class="f-temp">${maxT > 0 ? '+' : ''}${maxT}¬∞</span>
          `;
          fc.appendChild(card);
        }
      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 2. CURRENCIES (CBR API - —В–Њ–ї—М–Ї–Њ –Ї–Њ—В–Є—А–Њ–≤–Ї–Є –±–µ–Ј –≥—А–∞—Д–Є–Ї–∞)
    async function loadCurrencies() {
      try {
        const res = await fetch('https://www.cbr-xml-daily.ru/daily_json.js');
        const data = await res.json();
        const v = data.Valute;

        function setRate(code, valId, deltaId) {
          const item = v[code];
          if (!item) return;
          document.getElementById(valId).innerText = item.Value.toFixed(2) + ' вВљ';
          if (deltaId) {
            const diff = (item.Value - item.Previous).toFixed(2);
            const isUp = diff >= 0;
            const el = document.getElementById(deltaId);
            el.innerText = (isUp ? 'вЖС+' : 'вЖУ') + diff;
            el.className = 'curr-delta ' + (isUp ? 'delta-up' : 'delta-down');
          }
        }
        setRate('USD', 'usd-val', 'usd-delta');
        setRate('EUR', 'eur-val', 'eur-delta');
        setRate('CNY', 'cny-val', 'cny-delta');
      } catch (e) {
        console.error('Currencies error:', e);
      }
    }

    // 3. DYNAMIC YEAR PROGRESS
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' –У–Ю–Ф';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' –і–љ. –Њ—Б—В.';
    }

    loadWeather();
    loadCurrencies();
    updateYear();

    // Auto refresh every 10 min
    setInterval(() => {
      loadWeather();
      loadCurrencies();
      updateYear();
    }, 600000);
  </script>
</body>
</html>
