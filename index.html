<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Метрики задач</title><style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      --red: #e11d48;
      --red-bg: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
        --red: #f43f5e;
        --red-bg: #4c1d24;
        --green: #34d399;
        --green-bg: #133e2c;
        --blue: #60a5fa;
        --blue-bg: #1e3a5f;
        --amber: #fbbf24;
        --amber-bg: #451a03;
        --pill-bg: #2a2a2a;
      }
    }



*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;color:var(--text-main);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:8px}
.dashboard{max-width:1600px;margin:auto;padding:20px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-sub);font-weight:700}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:16px;min-width:0;min-height:148px;display:flex;flex-direction:column;gap:10px;transition:background .15s,border-color .15s,box-shadow .15s}
.card:hover{background:var(--tile-bg);border-color:var(--text-sub)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:5px}
.urgent{--accent:var(--red);--tint:var(--red-bg)}.active{--accent:var(--blue);--tint:var(--blue-bg)}.pool{--accent:var(--text-sub);--tint:var(--pill-bg)}.done{--accent:var(--green);--tint:var(--green-bg)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon{font-size:24px;line-height:1}
.badge{color:var(--accent);background:var(--tint);font-size:13px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.value-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.number{font-size:clamp(36px,3.3vw,44px);font-weight:780;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.caption{font-size:15px;line-height:1.25;color:var(--text-sub)}
.done-track{height:6px;background:var(--bar-bg);border-radius:99px;overflow:hidden;margin-top:auto}.done-fill{height:100%;background:var(--green);width:0}
.detail{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:12px 16px;border-radius:10px;background:var(--tile-bg);min-height:52px;font-size:15px;line-height:1.5;color:var(--text-sub)}
.detail[hidden]{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--text-sub);flex:none;margin-top:6px}
.context{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--divider)}
.weather-main,.year-pod,.year-top,.year-bar-row{display:flex;align-items:center;gap:12px}
.weather-temp-wrap{display:flex;align-items:baseline;gap:12px}.weather-icon{font-size:22px}.weather-temp{font-size:20px;font-weight:750}.weather-meta,.year-title,.year-left-chip{font-size:13px;color:var(--text-sub)}
.year-pct-big{font-size:20px;font-weight:750}.progress-track{height:7px;width:90px;background:var(--bar-bg);border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:var(--bar-fill)}
@media(max-width:1050px){.card{padding:16px;min-height:148px}.cards{gap:12px}.badge{font-size:13px}.caption{font-size:15px}.context{flex-wrap:wrap}.year-pod{flex-wrap:wrap}}
@media(max-width:760px){.dashboard{padding:16px}.heading{align-items:flex-start;flex-direction:column;gap:8px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.number{font-size:40px}.card{min-height:148px}.detail{font-size:15px}.weather-temp-wrap{flex-wrap:wrap;gap:6px}}
@media(max-width:380px){.dashboard{padding:12px}.cards{gap:12px}.card{padding:14px}.badge{font-size:12px;padding:6px}.icon{font-size:22px}.number{font-size:36px}.caption{font-size:14px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head><body>
<main class="dashboard">
<header class="heading"><h1>📊 Метрики задач</h1></header>
<section class="cards" aria-label="Показатели задач">
<button type="button" class="card urgent" data-metric="urgent" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">🔥</span><span class="badge">Срочно</span></span><span class="number" id="task-burning">24</span><span class="caption">Сегодня и просрочено</span></button>
<button type="button" class="card active" data-metric="active" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">⚡</span><span class="badge">Фокус</span></span><span class="number" id="task-progress">6</span><span class="caption">В работе</span></button>
<button type="button" class="card pool" data-metric="pool" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">📌</span><span class="badge">Пул</span></span><span class="number" id="task-todo">114</span><span class="caption">К выполнению</span></button>
<button type="button" class="card done" data-metric="done" aria-pressed="false" aria-controls="metric-detail"><span class="card-top"><span class="icon" aria-hidden="true">✅</span><span class="badge" id="task-done-sub">3 закрыто</span></span><span class="number" id="task-done">2%</span><span class="caption">Выполнено</span><span class="done-track" aria-hidden="true"><span class="done-fill" id="done-fill" style="display:block"></span></span></button>
</section>
<div class="detail" id="metric-detail" hidden role="status" aria-live="polite" aria-atomic="true"><span class="dot" id="detail-dot" aria-hidden="true"></span><p id="detail-text"></p></div>
<footer class="context">
<div class="weather-main"><span class="weather-icon" id="w-icon">⛅</span><div class="weather-temp-wrap"><span class="weather-temp" id="w-temp">—°C</span><span class="weather-meta" id="w-desc">Москва · загрузка</span></div></div>
<div class="year-pod"><div class="year-top"><span class="year-title" id="year-title">Год</span><span class="year-left-chip" id="year-left">— дн. ост.</span></div><div class="year-bar-row"><span class="year-pct-big" id="year-pct">—%</span><div class="progress-track"><div class="progress-fill" id="year-fill"></div></div></div></div>
</footer></main>
<script>
const params = new URLSearchParams(location.search);
function metric(key,fallback){const raw=params.get(key);if(raw===null||raw.trim()==='')return fallback;const n=Number(raw);return Number.isFinite(n)&&n>=0?n:fallback}
const metrics={urgent:Math.floor(metric('b',24)),active:Math.floor(metric('p',6)),pool:Math.floor(metric('t',114)),done:Math.floor(metric('d',3)),pct:Math.min(100,metric('pct',2))};
document.getElementById('task-burning').textContent=metrics.urgent;
document.getElementById('task-progress').textContent=metrics.active;
document.getElementById('task-todo').textContent=metrics.pool;
document.getElementById('task-done').textContent=metrics.pct+'%';
document.getElementById('task-done-sub').textContent=metrics.done+' закрыто';
document.getElementById('done-fill').style.width=metrics.pct+'%';
const explanations={
urgent:()=> 'Сегодня и просрочено: '+metrics.urgent+'. Задачи, которым нужно уделить внимание в первую очередь.',
active:()=> 'В работе: '+metrics.active+'. Задачи, которые уже начаты и сейчас находятся в процессе.',
pool:()=> 'К выполнению: '+metrics.pool+'. Задачи в очереди — из них можно выбрать следующий шаг.',
done:()=> 'Закрыто задач: '+metrics.done+'. Выполнено '+metrics.pct+'%. Показатели берутся из параметров ссылки виджета.'
};
const colors={urgent:'var(--red)',active:'var(--blue)',pool:'var(--text-sub)',done:'var(--green)'};
document.querySelectorAll('[data-metric]').forEach(button=>button.addEventListener('click',()=>{
const key=button.dataset.metric;
document.querySelectorAll('[data-metric]').forEach(card=>card.setAttribute('aria-pressed',String(card===button)));
document.getElementById('metric-detail').hidden=false;
document.getElementById('detail-text').textContent=explanations[key]();
document.getElementById('detail-dot').style.background=colors[key];
}));
    // 1. WEATHER LOGIC (Open-Meteo API)
    const WMO = {
      0: { icon: '☀️', text: 'Ясно' },
      1: { icon: '🌤️', text: 'Преим. ясно' },
      2: { icon: '⛅', text: 'Переменная' },
      3: { icon: '☁️', text: 'Пасмурно' },
      45: { icon: '🌫️', text: 'Туман' },
      48: { icon: '🌫️', text: 'Изморозь' },
      51: { icon: '🌦️', text: 'Морось' },
      53: { icon: '🌦️', text: 'Морось' },
      55: { icon: '🌧️', text: 'Морось' },
      61: { icon: '🌧️', text: 'Дождь' },
      63: { icon: '🌧️', text: 'Дождь' },
      65: { icon: '🌧️', text: 'Ливень' },
      71: { icon: '🌨️', text: 'Снег' },
      73: { icon: '🌨️', text: 'Снег' },
      75: { icon: '❄️', text: 'Снегопад' },
      77: { icon: '🌨️', text: 'Крупа' },
      80: { icon: '🌦️', text: 'Ливневый дождь' },
      81: { icon: '🌧️', text: 'Сильный дождь' },
      85: { icon: '🌨️', text: 'Снегопад' },
      95: { icon: '⛈️', text: 'Гроза' }
    };
    const DAYS = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

    async function loadWeather() {
      try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=55.7558&longitude=37.6173&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FMoscow';
        const res = await fetch(url);
        const data = await res.json();
        const curr = data.current_weather;
        const wInfo = WMO[curr.weathercode] || { icon: '⛅', text: 'Облачно' };

        document.getElementById('w-temp').innerText = (curr.temperature > 0 ? '+' : '') + Math.round(curr.temperature) + '°C';
        document.getElementById('w-icon').innerText = wInfo.icon;
        document.getElementById('w-desc').innerText = 'Москва · ' + wInfo.text;

      } catch (e) {
        console.error('Weather error:', e);
      }
    }

    // 3. DYNAMIC YEAR PROGRESS
    function updateYear() {
      const now = new Date();
      const year = now.getFullYear();
      const start = new Date(year, 0, 1);
      const end = new Date(year + 1, 0, 1);

      const elapsed = now - start;
      const total = end - start;
      const pct = (elapsed / total * 100).toFixed(1);

      const oneDay = 1000 * 60 * 60 * 24;
      const day = Math.floor(elapsed / oneDay) + 1;
      const totalDays = Math.round(total / oneDay);
      const left = totalDays - day;

      document.getElementById('year-title').innerText = year + ' ГОД';
      document.getElementById('year-pct').innerText = pct + '%';
      document.getElementById('year-fill').style.width = pct + '%';
      document.getElementById('year-left').innerText = left + ' дн. ост.';
    }

    loadWeather();

    updateYear();

    setInterval(() => {
      loadWeather();

      updateYear();
    }, 600000);
  </script></body></html>
