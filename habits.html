<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер привычек</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #10b981, #059669);
      --green: #10b981;
      --green-bg: #d1fae5;
      --green-border: #34d399;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --purple: #8b5cf6;
      --purple-bg: #ede9fe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #34d399, #10b981);
        --green: #34d399;
        --green-bg: rgba(16, 185, 129, 0.18);
        --green-border: rgba(52, 211, 153, 0.4);
        --blue: #60a5fa;
        --blue-bg: rgba(37, 99, 235, 0.18);
        --purple: #a78bfa;
        --purple-bg: rgba(139, 92, 246, 0.18);
        --amber: #fbbf24;
        --amber-bg: rgba(217, 119, 6, 0.18);
        --pill-bg: #2a2a2a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 6px;
      margin: 0;
      user-select: none;
    }

    .dashboard {
      max-width: 1600px;
      margin: auto;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      box-sizing: border-box;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 14px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 700;
    }

    .date-badge {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
      background: var(--pill-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .content-wrap {
      flex: none;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grid {
      display: flex;
      flex-wrap: nowrap;
      min-width: 0;
      width: 100%;
      align-items: stretch;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      flex: none;
    }
    .grid::-webkit-scrollbar {
      height: 5px;
    }

    .habit-card {
      appearance: none;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s;
      position: relative;
      flex: 0 0 148px;
      min-width: 148px;
      min-height: 96px;
      align-self: stretch;
    }

    .habit-card:hover {
      background: var(--tile-bg);
      border-color: var(--text-sub);
    }

    .habit-card:active {
      transform: scale(0.97);
    }

    .habit-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -3px;
    }

    .habit-card.completed {
      background: var(--green-bg);
      border-color: var(--green-border);
      opacity: 0.85;
    }

    .habit-card.completed:hover {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .habit-icon {
      font-size: 22px;
      line-height: 1;
    }

    .habit-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--text-sub);
      background: var(--pill-bg);
      white-space: nowrap;
      transition: all .15s;
    }

    .habit-card.completed .habit-badge {
      background: var(--green);
      color: #ffffff;
    }

    .habit-title {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      min-height: 34px;
    }

    .habit-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: auto;
      padding-top: 4px;
    }

    .weekly-dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--bar-bg);
      transition: background .15s;
    }

    .dot.filled {
      background: var(--green);
    }

    .all-done-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 16px 22px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 14px;
      margin: auto 0;
      box-sizing: border-box;
    }

    .all-done-icon {
      font-size: 30px;
      line-height: 1;
    }

    .all-done-title {
      font-size: 15px;
      font-weight: 750;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .all-done-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .completed-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--divider);
    }

    .completed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .footer-bar {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .track {
      flex: 1;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--bar-fill);
      width: 0%;
      transition: width .3s ease;
    }

    .toggle-btn {
      appearance: none;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }

    .toggle-btn:hover {
      background: var(--tile-hover);
    }

    @media(max-width: 760px) {
      body { padding: 4px; }
      .dashboard {
        padding: 8px 12px;
        border-radius: 14px;
        min-height: 0;
      }
      .heading { margin-bottom: 6px; }
      .grid {
        gap: 8px;
        padding-bottom: 2px;
      }
      .habit-card {
        flex: 0 0 132px;
        min-width: 132px;
        min-height: 92px;
        padding: 8px 10px;
        gap: 4px;
        border-radius: 11px;
      }
      .card-top { gap: 4px; }
      .habit-icon { font-size: 18px; }
      .habit-badge { font-size: 10px; padding: 2px 5px; border-radius: 6px; }
      .habit-title { font-size: 12px; }
      .habit-sub { font-size: 10.5px; padding-top: 2px; }
      .footer-bar { margin-top: 6px; padding-top: 6px; font-size: 11px; gap: 8px; }
      .all-done-banner { padding: 12px 14px; gap: 10px; border-radius: 11px; margin: auto 0; }
      .all-done-icon { font-size: 24px; }
      .all-done-title { font-size: 13.5px; }
      .all-done-sub { font-size: 11px; }
    }
    .settings-btn { appearance:none; border:0; background:transparent; color:var(--text-sub); font:20px/1 system-ui; width:28px; height:24px; padding:0; cursor:pointer; border-radius:6px; }
    .settings-btn:hover { background:var(--pill-bg); }
    .settings-btn:focus-visible { outline:2px solid var(--blue); }
    .settings-btn:disabled { opacity:.45; cursor:default; }
    .title-wrap { gap:6px; }
    .title-wrap .sync-dot { margin-left:2px; }
    .done-check { position:absolute; right:12px; top:10px; color:var(--green); font-weight:700; }
  .sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-left:8px;vertical-align:middle;flex:none;cursor:help}.sync-dot[data-state="ok"]{background:#22a06b}.sync-dot[data-state="pending"]{background:#e5a000}.sync-dot[data-state="error"]{background:#e5484d}</style>
</head>
<body>
  <main class="dashboard">
    <div class="content-wrap">
      <header class="heading">
        <div class="title-wrap">
          <h1>🌱 Привычки</h1><button id="clock-settings" type="button" class="settings-btn" aria-label="Настройки основного телефона" title="Настройки основного телефона">⚙</button><span id="sync-status" class="sync-dot" role="status" tabindex="0" aria-label="Загрузка"></span>
          
        </div>
      </header>

      <!-- Active Habits (only uncompleted for today) -->
      <section class="grid" id="active-grid" aria-label="Привычки на сегодня">
        <!-- Rendered by JS -->
      </section>

    </div>

    <footer class="footer-bar">
      <span>Ежедневные: <strong id="pct-label" style="color:var(--text-main);">0%</strong></span>
      <div class="track"><div class="fill" id="total-fill"></div></div>
      <span id="summary-label">—</span>
    </footer>
  </main>

  <script src="habits-metrics.js?v=monthly-v1"></script>
  <script src="habits-sync.js?v=sorted-settings-v2"></script>
  <script>
    let current=null, busy=new Set();
    const status=document.getElementById('sync-status');
    function completed(h){return h.done_today||(h.type==='weekly'&&h.week_done>=h.goal);}
    function dailyCaption(h){
      const title=h.title.toLowerCase();
      for(const [pattern,text] of [[/контраст|душ/,'Пора взбодриться'],[/английск/,'Короткий урок'],[/отжим/,'Становимся сильнее'],[/присед/,'Добавим движения'],[/медита/,'Время выдохнуть'],[/заряд/,'Заряд на весь день'],[/кап[ауы]/,'Забота об улыбке'],[/бассейн|плаван/,'Время поплавать']])if(pattern.test(title))return text;
      return 'Время для себя';
    }
    function makeCard(h){
      const button=document.createElement('button');button.type='button';button.className='habit-card'+(completed(h)?' completed':'');button.dataset.habitId=h.id;button.disabled=busy.has(h.id)||!current.ready||(h.type==='weekly'&&h.week_done>=h.goal&&!h.done_today);
      const icon=document.createElement('span');icon.className='habit-icon';icon.textContent=h.icon;
      const title=document.createElement('span');title.className='habit-title';title.textContent=h.title;title.title=h.title;
      const sub=document.createElement('span');sub.className='habit-sub';sub.textContent=h.type==='daily'?dailyCaption(h):'За неделю: '+h.week_done+' / '+h.goal;
      button.append(icon,title,sub);
      if(completed(h)){const check=document.createElement('span');check.className='done-check';check.textContent='✓';check.setAttribute('aria-hidden','true');button.append(check);}
      button.setAttribute('aria-pressed',String(h.done_today));
      button.onclick=async()=>{if(busy.has(h.id))return;busy.add(h.id);button.disabled=true;try{await HabitsSync.setHabit(h.id,!h.done_today);}catch(e){status.dataset.state='error';status.title='Не удалось сохранить отметку: '+e.message;}finally{busy.delete(h.id);render(current);}};
      return button;
    }
    function render(value){
      current=value;if(!value)return;
      HabitsSync.renderStatus(status,value);
      if(!value.data)return;
      const habits=Object.values(value.data.habits).sort((a,b)=>Number(completed(a))-Number(completed(b))||(a.type==='weekly')-(b.type==='weekly')),active=document.getElementById('active-grid');
      const scroll=active.scrollLeft;
      const oldPositions=new Map([...active.children].map(el=>[el.dataset.habitId,el.getBoundingClientRect().left]));
      const focusedId=document.activeElement?.dataset.habitId;
      active.replaceChildren();
      for(const h of habits)active.append(makeCard(h));
      active.scrollLeft=scroll;
      for(const card of active.children){
        if(card.dataset.habitId===focusedId)card.focus({preventScroll:true});
        const oldLeft=oldPositions.get(card.dataset.habitId);
        if(oldLeft!==undefined&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
          const delta=oldLeft-card.getBoundingClientRect().left;
          if(delta)card.animate([{transform:`translateX(${delta}px)`},{transform:'translateX(0)'}],{duration:280,easing:'ease-out'});
        }
      }
      if(!habits.length){const text=document.createElement('p');text.textContent='Добавь привычку в базу Notion — кнопка появится автоматически.';active.append(text);}
      const daily=HabitMetrics.day(value.data,value.data.today);
      document.getElementById('summary-label').textContent=daily.count+' из '+daily.total;
      document.getElementById('pct-label').textContent=(daily.total?Math.round(100*daily.count/daily.total):0)+'%';
      document.getElementById('total-fill').style.width=(daily.total?100*daily.count/daily.total:0)+'%';
    }
    for(const id of ['active-grid'])document.getElementById(id).addEventListener('wheel',e=>{if(e.deltaY && !e.deltaX)e.currentTarget.scrollLeft+=e.deltaY;},{passive:true});
    HabitsSync.subscribe(render);HabitsSync.start();
  </script>
</body>
</html>
