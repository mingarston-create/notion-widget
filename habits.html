<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер привычек</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #10b981, #059669);
      --green: #10b981;
      --green-bg: #d1fae5;
      --green-border: #34d399;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --purple: #8b5cf6;
      --purple-bg: #ede9fe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #34d399, #10b981);
        --green: #34d399;
        --green-bg: rgba(16, 185, 129, 0.18);
        --green-border: rgba(52, 211, 153, 0.4);
        --blue: #60a5fa;
        --blue-bg: rgba(37, 99, 235, 0.18);
        --purple: #a78bfa;
        --purple-bg: rgba(139, 92, 246, 0.18);
        --amber: #fbbf24;
        --amber-bg: rgba(217, 119, 6, 0.18);
        --pill-bg: #2a2a2a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 6px;
      margin: 0;
      user-select: none;
    }

    .dashboard {
      max-width: 1600px;
      margin: auto;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      min-height: calc(100% - 12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 14px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 700;
    }

    .date-badge {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
      background: var(--pill-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .content-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grid {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      flex: 1;
    }
    .grid::-webkit-scrollbar {
      display: none;
    }

    .habit-card {
      appearance: none;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s;
      position: relative;
      flex: 0 0 148px;
      min-width: 148px;
      min-height: 96px;
      align-self: flex-start;
    }

    .habit-card:hover {
      background: var(--tile-bg);
      border-color: var(--text-sub);
    }

    .habit-card:active {
      transform: scale(0.97);
    }

    .habit-card:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -3px;
    }

    .habit-card.completed {
      background: var(--green-bg);
      border-color: var(--green-border);
      opacity: 0.85;
    }

    .habit-card.completed:hover {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .habit-icon {
      font-size: 22px;
      line-height: 1;
    }

    .habit-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--text-sub);
      background: var(--pill-bg);
      white-space: nowrap;
      transition: all .15s;
    }

    .habit-card.completed .habit-badge {
      background: var(--green);
      color: #ffffff;
    }

    .habit-title {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      min-height: 34px;
    }

    .habit-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: auto;
      padding-top: 4px;
    }

    .weekly-dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--bar-bg);
      transition: background .15s;
    }

    .dot.filled {
      background: var(--green);
    }

    .all-done-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 16px 22px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 14px;
      margin: auto 0;
      box-sizing: border-box;
    }

    .all-done-icon {
      font-size: 30px;
      line-height: 1;
    }

    .all-done-title {
      font-size: 15px;
      font-weight: 750;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .all-done-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .completed-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--divider);
    }

    .completed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .footer-bar {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .track {
      flex: 1;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--bar-fill);
      width: 0%;
      transition: width .3s ease;
    }

    .toggle-btn {
      appearance: none;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }

    .toggle-btn:hover {
      background: var(--tile-hover);
    }

    @media(max-width: 760px) {
      body { padding: 4px; }
      .dashboard {
        padding: 8px 12px;
        border-radius: 14px;
        min-height: calc(100% - 8px);
      }
      .heading { margin-bottom: 6px; }
      .grid {
        gap: 8px;
        padding-bottom: 2px;
      }
      .habit-card {
        flex: 0 0 132px;
        min-width: 132px;
        min-height: 92px;
        padding: 8px 10px;
        gap: 4px;
        border-radius: 11px;
      }
      .card-top { gap: 4px; }
      .habit-icon { font-size: 18px; }
      .habit-badge { font-size: 10px; padding: 2px 5px; border-radius: 6px; }
      .habit-title { font-size: 12px; }
      .habit-sub { font-size: 10.5px; padding-top: 2px; }
      .footer-bar { margin-top: 6px; padding-top: 6px; font-size: 11px; gap: 8px; }
      .all-done-banner { padding: 12px 14px; gap: 10px; border-radius: 11px; margin: auto 0; }
      .all-done-icon { font-size: 24px; }
      .all-done-title { font-size: 13.5px; }
      .all-done-sub { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <div class="content-wrap">
      <header class="heading">
        <div class="title-wrap">
          <h1>🌱 Привычки</h1>
          <span class="date-badge" id="current-date">—</span>
        </div>
      </header>

      <!-- Active Habits (only uncompleted for today) -->
      <section class="grid" id="active-grid" aria-label="Привычки на сегодня">
        <!-- Rendered by JS -->
      </section>

      <!-- Completed Habits (hidden by default) -->
      <section class="completed-section" id="completed-section" style="display:none;">
        <div class="completed-header">
          <span>Выполнено сегодня (нажми для отмены)</span>
          <span id="completed-count-label">0</span>
        </div>
        <div class="grid" id="completed-grid">
          <!-- Rendered by JS -->
        </div>
      </section>
    </div>

    <details id="weekly-completed" style="margin:12px 0"><summary id="weekly-summary" style="cursor:pointer">Выполнено за неделю</summary><div class="grid" id="weekly-grid"></div></details>
    <footer class="footer-bar">
      <span>Ежедневные: <strong id="pct-label" style="color:var(--text-main);">0%</strong></span>
      <div class="track"><div class="fill" id="total-fill"></div></div>
      <button type="button" class="toggle-btn" id="toggle-completed-btn" onclick="toggleCompletedTray()" style="display:none;">
        <span id="toggle-icon">👁️</span>
        <span id="toggle-text">Скрыто: 0</span>
      </button>
      <span id="summary-label">—</span>
    </footer>
  </main>

  <script src="habits-metrics.js?v=monthly-v1"></script>
  <script src="habits-sync.js?v=phone-clock-v1"></script>
  <script>
    let showCompletedTray=false, current=null, busy=new Set();
    const status=document.createElement('div');status.id='sync-status';status.setAttribute('role','status');status.style.cssText='font-size:12px;padding:8px 0;color:var(--text-sub);line-height:1.4';
    document.querySelector('.heading').after(status);
    function toggleCompletedTray(){showCompletedTray=!showCompletedTray;render(current);}
    function makeCard(h){
      const button=document.createElement('button');button.type='button';button.className='habit-card'+(h.done_today?' completed':'');button.disabled=busy.has(h.id)||!current.ready||(h.type==='weekly'&&h.week_done>=h.goal&&!h.done_today);
      const icon=document.createElement('span');icon.className='habit-icon';icon.textContent=h.icon;
      const title=document.createElement('span');title.className='habit-title';title.textContent=h.title;title.title=h.title;
      const badge=document.createElement('span');badge.className='habit-badge';badge.textContent=h.done_today?'Сегодня ✓':h.week_done>=h.goal?'План недели ✓':'Отметить';
      const sub=document.createElement('span');sub.className='habit-sub';sub.textContent=h.type==='daily'?'Каждый день':'За неделю: '+h.week_done+' / '+h.goal;
      button.append(icon,title,badge,sub);button.setAttribute('aria-pressed',String(h.done_today));
      button.onclick=async()=>{if(busy.has(h.id))return;busy.add(h.id);button.disabled=true;try{await HabitsSync.setHabit(h.id,!h.done_today);}catch(e){status.textContent='Не удалось сохранить отметку: '+e.message;}finally{busy.delete(h.id);render(current);}};
      return button;
    }
    function render(value){
      current=value;if(!value)return;
      status.textContent=value.error || (value.pending ? 'Сохранено на устройстве · ждут отправки: '+value.pending : value.data?.sync.pending_days ? 'Сохранено на сервере · передаём в Notion' : value.data ? 'Сохранено в Notion' : 'Загружаем привычки…');
      if(value.data?.sync.error && !value.error && !value.pending) status.textContent='Сохранено на сервере · Notion временно недоступен';
      if(!value.data)return;
      const habits=Object.values(value.data.habits).sort((a,b)=>(a.type==='weekly')-(b.type==='weekly')),active=document.getElementById('active-grid'),completed=document.getElementById('completed-grid');active.replaceChildren();completed.replaceChildren();
      const weekly=document.getElementById('weekly-grid');weekly.replaceChildren();
      const closed=h=>h.type==='weekly'&&h.week_done>=h.goal;
      for(const h of habits)(closed(h)?weekly:h.done_today?completed:active).append(makeCard(h));
      const closedCount=habits.filter(closed).length;document.getElementById('weekly-completed').hidden=!closedCount;document.getElementById('weekly-summary').textContent='Выполнено за неделю · '+closedCount;
      const count=habits.filter(h=>h.done_today&&!closed(h)).length,total=habits.length;
      if(count+closedCount===total && total){const text=document.createElement('p');text.textContent='🎉 Все привычки на сегодня выполнены';active.append(text);}
      if(!total){const text=document.createElement('p');text.textContent='Добавь привычку в базу Notion — кнопка появится автоматически.';active.append(text);}
      document.getElementById('completed-section').style.display=showCompletedTray&&count?'block':'none';
      document.getElementById('toggle-completed-btn').style.display=count?'inline-flex':'none';
      document.getElementById('toggle-text').textContent=showCompletedTray?'Скрыть выполненные':'Скрыто: '+count;
      document.getElementById('completed-count-label').textContent=count+' из '+total;
      const daily=HabitMetrics.day(value.data,value.data.today);
      document.getElementById('summary-label').textContent=daily.count+' из '+daily.total;
      document.getElementById('pct-label').textContent=(daily.total?Math.round(100*daily.count/daily.total):0)+'%';
      document.getElementById('total-fill').style.width=(daily.total?100*daily.count/daily.total:0)+'%';
      document.getElementById('current-date').textContent=new Date(value.data.today+'T12:00:00Z').toLocaleDateString('ru-RU',{timeZone:'UTC',day:'numeric',month:'short'})+' · день с 03:00';
    }
    for(const id of ['active-grid','completed-grid'])document.getElementById(id).addEventListener('wheel',e=>{if(e.deltaY && !e.deltaX)e.currentTarget.scrollLeft+=e.deltaY;},{passive:true});
    HabitsSync.subscribe(render);HabitsSync.start();
  </script>
</body>
</html>
