<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Трекер привычек</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e9e9e7;
      --text-main: #37352f;
      --text-sub: #787774;
      --divider: #ebebeb;
      --tile-bg: #fbfbfa;
      --tile-hover: #f1f1ef;
      --bar-bg: #e5e5e5;
      --bar-fill: linear-gradient(90deg, #10b981, #059669);
      --green: #10b981;
      --green-bg: #d1fae5;
      --green-border: #34d399;
      --blue: #2563eb;
      --blue-bg: #dbeafe;
      --purple: #8b5cf6;
      --purple-bg: #ede9fe;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --pill-bg: #f7f6f3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --card-border: #2f2f2f;
        --text-main: #ffffff;
        --text-sub: #9b9b9b;
        --divider: #333333;
        --tile-bg: #272727;
        --tile-hover: #303030;
        --bar-bg: #333333;
        --bar-fill: linear-gradient(90deg, #34d399, #10b981);
        --green: #34d399;
        --green-bg: rgba(16, 185, 129, 0.18);
        --green-border: rgba(52, 211, 153, 0.4);
        --blue: #60a5fa;
        --blue-bg: rgba(37, 99, 235, 0.18);
        --purple: #a78bfa;
        --purple-bg: rgba(139, 92, 246, 0.18);
        --amber: #fbbf24;
        --amber-bg: rgba(217, 119, 6, 0.18);
        --pill-bg: #2a2a2a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 6px;
      margin: 0;
      user-select: none;
    }

    .dashboard {
      max-width: 1600px;
      margin: auto;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      min-height: calc(100% - 12px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-size: 14px;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--text-sub);
      font-weight: 700;
    }

    .date-badge {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
      background: var(--pill-bg);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .grid {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .grid::-webkit-scrollbar {
      display: none;
    }

    .habit-card {
      appearance: none;
      text-align: left;
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background .15s, border-color .15s, transform .12s, box-shadow .15s;
      position: relative;
      flex: 0 0 148px;
      min-width: 148px;
      min-height: 96px;
    }

    .habit-card:hover {
      background: var(--tile-bg);
      border-color: var(--text-sub);
      transform: translateY(-1px);
    }

    .habit-card:active {
      transform: scale(0.97);
    }

    .habit-card.completed {
      background: var(--green-bg);
      border-color: var(--green-border);
      opacity: 0.85;
    }

    .habit-card.completed:hover {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .habit-icon {
      font-size: 22px;
      line-height: 1;
    }

    .habit-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      color: var(--text-sub);
      background: var(--pill-bg);
      white-space: nowrap;
      transition: all .15s;
    }

    .habit-card.completed .habit-badge {
      background: var(--green);
      color: #ffffff;
    }

    .habit-title {
      font-size: 13.5px;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .habit-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-sub);
      margin-top: auto;
      padding-top: 4px;
    }

    .weekly-dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: var(--bar-bg);
      transition: background .15s;
    }

    .dot.filled {
      background: var(--green);
    }

    .all-done-banner {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 14px;
    }

    .all-done-icon {
      font-size: 28px;
      line-height: 1;
    }

    .all-done-title {
      font-size: 14.5px;
      font-weight: 750;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .all-done-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .completed-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--divider);
    }

    .completed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 8px;
    }

    .footer-bar {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .track {
      flex: 1;
      height: 6px;
      background: var(--bar-bg);
      border-radius: 99px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      background: var(--bar-fill);
      width: 0%;
      transition: width .3s ease;
    }

    .toggle-btn {
      appearance: none;
      background: var(--pill-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s;
    }

    .toggle-btn:hover {
      background: var(--tile-hover);
    }

    @media(max-width: 760px) {
      body { padding: 4px; }
      .dashboard {
        padding: 8px 12px;
        border-radius: 14px;
        min-height: calc(100% - 8px);
      }
      .heading { margin-bottom: 6px; }
      .grid {
        gap: 8px;
        padding-bottom: 2px;
      }
      .habit-card {
        flex: 0 0 132px;
        min-width: 132px;
        min-height: 92px;
        padding: 8px 10px;
        gap: 4px;
        border-radius: 11px;
      }
      .card-top { gap: 4px; }
      .habit-icon { font-size: 18px; }
      .habit-badge { font-size: 10px; padding: 2px 5px; border-radius: 6px; }
      .habit-title { font-size: 12px; }
      .habit-sub { font-size: 10.5px; padding-top: 2px; }
      .footer-bar { margin-top: 6px; padding-top: 6px; font-size: 11px; gap: 8px; }
      .all-done-banner { padding: 10px 14px; gap: 10px; border-radius: 11px; }
      .all-done-icon { font-size: 24px; }
      .all-done-title { font-size: 13px; }
      .all-done-sub { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="dashboard">
    <div>
      <header class="heading">
        <div class="title-wrap">
          <h1>🌱 Привычки</h1>
          <span class="date-badge" id="current-date">—</span>
        </div>
      </header>

      <!-- Active Habits (only uncompleted for today) -->
      <section class="grid" id="active-grid" aria-label="Привычки на сегодня">
        <!-- Rendered by JS -->
      </section>

      <!-- Completed Habits (hidden by default) -->
      <section class="completed-section" id="completed-section" style="display:none;">
        <div class="completed-header">
          <span>Выполнено сегодня (нажми для отмены)</span>
          <span id="completed-count-label">0</span>
        </div>
        <div class="grid" id="completed-grid">
          <!-- Rendered by JS -->
        </div>
      </section>
    </div>

    <footer class="footer-bar">
      <span>Прогресс: <strong id="pct-label" style="color:var(--text-main);">0%</strong></span>
      <div class="track"><div class="fill" id="total-fill"></div></div>
      <button type="button" class="toggle-btn" id="toggle-completed-btn" onclick="toggleCompletedTray()" style="display:none;">
        <span id="toggle-icon">👁️</span>
        <span id="toggle-text">Скрыто: 0</span>
      </button>
      <span id="summary-label">0 из 8</span>
    </footer>
  </main>

  <script>
    const HABIT_CONFIG = [
      { id: 'english', icon: '🇬🇧', title: 'Английский', type: 'daily', goal: 7, label: 'Каждый день' },
      { id: 'exercise', icon: '🤸', title: 'Зарядка', type: 'daily', goal: 7, label: 'Каждый день' },
      { id: 'shower', icon: '🚿', title: 'Контрастный душ', type: 'daily', goal: 7, label: 'Каждый день' },
      { id: 'pushups', icon: '💪', title: 'Отжимания', type: 'daily', goal: 7, label: 'Каждый день' },
      { id: 'squats', icon: '🦵', title: 'Приседания', type: 'daily', goal: 7, label: 'Каждый день' },
      { id: 'pool', icon: '🏊‍♂️', title: 'Бассейн', type: 'weekly', goal: 2, label: '2 р/нед' },
      { id: 'mouthguard', icon: '🦷', title: 'Каппа на ночь', type: 'weekly', goal: 1, label: '1 р/нед' },
      { id: 'meditation', icon: '🧘', title: 'Медитация', type: 'weekly', goal: 1, label: '1 р/нед' }
    ];

    const STORAGE_KEY = 'notion_habits_v2';
    let showCompletedTray = false;

    // Shift time by -3 hours so new day begins at 03:00 AM sharp
    function getEffectiveNow() {
      return new Date(Date.now() - 3 * 3600 * 1000);
    }

    function getTodayKey() {
      const d = getEffectiveNow();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getWeekKey() {
      const d = getEffectiveNow();
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = (date.getDay() + 6) % 7 + 1; // 1 (Mon) - 7 (Sun)
      date.setDate(date.getDate() - day + 4); // Thursday of this week
      const year = date.getFullYear();
      const firstJan = new Date(year, 0, 1);
      const daysSinceFirstJan = Math.round((date - firstJan) / 86400000);
      const weekNo = Math.floor(daysSinceFirstJan / 7) + 1;
      return year + '-W' + String(weekNo).padStart(2, '0');
    }

    function loadState() {
      const todayKey = getTodayKey();
      const weekKey = getWeekKey();
      let state = {
        lastDay: todayKey,
        lastWeek: weekKey,
        daily: {},
        weekly: {}
      };

      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('notion_habits_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.lastDay === todayKey) {
            state.daily = parsed.daily || {};
          }
          if (parsed.lastWeek === weekKey && parsed.weekly) {
            for (const [k, v] of Object.entries(parsed.weekly)) {
              if (typeof v === 'number') {
                state.weekly[k] = { count: v, lastDoneDay: parsed.lastDay === todayKey ? todayKey : null };
              } else if (v && typeof v === 'object') {
                state.weekly[k] = v;
              }
            }
          }
        }
      } catch (e) {
        console.error('Error loading state:', e);
      }
      return state;
    }

    let appState = loadState();

    function saveState() {
      appState.lastDay = getTodayKey();
      appState.lastWeek = getWeekKey();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Save error:', e);
      }
    }

    function isHabitDoneToday(h) {
      if (h.type === 'daily') {
        return !!appState.daily[h.id];
      }
      const w = appState.weekly[h.id] || { count: 0, lastDoneDay: null };
      const todayKey = getTodayKey();
      return w.lastDoneDay === todayKey || w.count >= h.goal;
    }

    function completeHabit(id) {
      const conf = HABIT_CONFIG.find(h => h.id === id);
      if (!conf) return;

      const todayKey = getTodayKey();
      if (conf.type === 'daily') {
        appState.daily[id] = true;
      } else {
        const cur = appState.weekly[id] || { count: 0, lastDoneDay: null };
        appState.weekly[id] = {
          count: Math.min(conf.goal, (cur.count || 0) + 1),
          lastDoneDay: todayKey
        };
      }
      saveState();
      render();
    }

    function uncompleteHabit(id) {
      const conf = HABIT_CONFIG.find(h => h.id === id);
      if (!conf) return;

      if (conf.type === 'daily') {
        appState.daily[id] = false;
      } else {
        const cur = appState.weekly[id] || { count: 0, lastDoneDay: null };
        appState.weekly[id] = {
          count: Math.max(0, (cur.count || 0) - 1),
          lastDoneDay: null
        };
      }
      saveState();
      render();
    }

    function toggleCompletedTray() {
      showCompletedTray = !showCompletedTray;
      render();
    }

    function createCard(h, isCompleted) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'habit-card ' + (isCompleted ? 'completed' : '');
      card.setAttribute('aria-label', h.title + (isCompleted ? ' (выполнено)' : ''));
      card.onclick = () => isCompleted ? uncompleteHabit(h.id) : completeHabit(h.id);

      let badgeText = h.label;
      let subHtml = '';

      if (h.type === 'daily') {
        if (isCompleted) {
          badgeText = 'Сделано ✅';
          subHtml = '<span style="color:var(--green)">Закрыто · нажми для отмены</span>';
        } else {
          badgeText = 'Каждый день';
          subHtml = '<span>Надо сделать</span>';
        }
      } else {
        const w = appState.weekly[h.id] || { count: 0, lastDoneDay: null };
        const count = w.count || 0;
        let dots = '';
        for (let i = 0; i < h.goal; i++) {
          dots += `<span class="dot ${i < count ? 'filled' : ''}"></span>`;
        }

        if (isCompleted) {
          badgeText = count + '/' + h.goal + ' ✅';
          subHtml = `<div class="weekly-dots">${dots}</div><span style="color:var(--green)">${count >= h.goal ? 'План недели закрыт' : 'Сделано сегодня'}</span>`;
        } else {
          badgeText = count + '/' + h.goal + ' в нед';
          subHtml = `<div class="weekly-dots">${dots}</div><span>Недельная цель</span>`;
        }
      }

      card.innerHTML = `
        <div class="card-top">
          <span class="habit-icon">${h.icon}</span>
          <span class="habit-badge">${badgeText}</span>
        </div>
        <div class="habit-title">${h.title}</div>
        <div class="habit-sub">${subHtml}</div>
      `;
      return card;
    }

    function render() {
      // Check for day/week rollover
      const todayKey = getTodayKey();
      const weekKey = getWeekKey();
      if (appState.lastDay !== todayKey || appState.lastWeek !== weekKey) {
        appState = loadState();
      }

      const activeGrid = document.getElementById('active-grid');
      const completedGrid = document.getElementById('completed-grid');
      const completedSection = document.getElementById('completed-section');
      const toggleBtn = document.getElementById('toggle-completed-btn');

      activeGrid.innerHTML = '';
      completedGrid.innerHTML = '';

      let activeCount = 0;
      let completedCount = 0;

      HABIT_CONFIG.forEach(h => {
        const done = isHabitDoneToday(h);
        if (done) {
          completedCount++;
          completedGrid.appendChild(createCard(h, true));
        } else {
          activeCount++;
          activeGrid.appendChild(createCard(h, false));
        }
      });

      // All done celebration state
      if (activeCount === 0) {
        activeGrid.innerHTML = `
          <div class="all-done-banner">
            <span class="all-done-icon">🎉</span>
            <div>
              <div class="all-done-title">Все 8 привычек на сегодня закрыты!</div>
              <div class="all-done-sub">Отличный день! Следующий цикл откроется в 03:00 ночи.</div>
            </div>
          </div>
        `;
      }

      // Update completed tray visibility
      if (completedCount > 0) {
        toggleBtn.style.display = 'inline-flex';
        document.getElementById('toggle-text').innerText = (showCompletedTray ? 'Скрыть готовые (' : 'Скрыто: ') + completedCount + (showCompletedTray ? ')' : '');
        completedSection.style.display = showCompletedTray ? 'block' : 'none';
        document.getElementById('completed-count-label').innerText = completedCount + ' из ' + HABIT_CONFIG.length;
      } else {
        toggleBtn.style.display = 'none';
        completedSection.style.display = 'none';
      }

      // Overall Progress
      const total = HABIT_CONFIG.length;
      const pct = Math.round((completedCount / total) * 100);

      document.getElementById('pct-label').innerText = pct + '%';
      document.getElementById('summary-label').innerText = completedCount + ' из ' + total;
      document.getElementById('total-fill').style.width = pct + '%';

      // Effective Date
      const nowEff = getEffectiveNow();
      const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      document.getElementById('current-date').innerText = days[nowEff.getDay()] + ', ' + nowEff.getDate() + ' ' + months[nowEff.getMonth()];
    }

    // Horizontal wheel scroll support for traditional mice
    ['active-grid', 'completed-grid'].forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0 && e.deltaX === 0) {
            el.scrollLeft += e.deltaY;
          }
        }, { passive: true });
      }
    });

    render();

    // Check periodically for 03:00 AM reset
    setInterval(() => {
      const todayKey = getTodayKey();
      if (appState.lastDay !== todayKey) {
        appState = loadState();
        render();
      }
    }, 20000);
  </script>
</body>
</html>
