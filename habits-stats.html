<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трекер привычек</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:6px;background:transparent;color:#506b5d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.dashboard{width:100%;max-width:1000px;margin:0 auto;padding:18px;border:1px solid #e3ebe5;border-radius:20px;background:#fff}.calendar-head{position:relative;display:flex;justify-content:center;align-items:center;margin-bottom:20px;padding:0 20px}.navigation{display:flex;align-items:center;gap:16px}button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent}button:focus-visible{outline:2px solid #87ae99;outline-offset:3px}.nav{width:32px;height:36px;font-size:28px}.month{font-size:20px;font-weight:600;min-width:190px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekdays{margin-bottom:12px}.weekday{text-align:center;font-size:11px;color:#86968b}.day{aspect-ratio:1.35;min-width:0;border-radius:10px;text-align:left;padding:9px;display:flex;align-items:flex-start;justify-content:flex-start;font-size:14px;font-weight:500;color:#506b5d;background:#f0f1ee;border:1px solid transparent;cursor:default}.day[data-level="1"]{background:#eff8f1}.day[data-level="2"]{background:#e0f1e6}.day[data-level="3"]{background:#cbe6d5}.day[data-level="4"]{background:#b8dcc8}.day[data-level="5"]{background:#a5ceb8}.day.future,.day.unknown{background:#fafcfa;color:#98a39c;border-color:#eaf0ec}.day.unknown{border-style:dashed}.day.current{outline:2px solid #87ae99;outline-offset:1px}.sync-dot{position:absolute;right:0;width:8px;height:8px;border-radius:50%;background:#b0b9b2}.sync-dot[data-state="ok"]{background:#99bf9c}.sync-dot[data-state="pending"]{background:#dec48b}.sync-dot[data-state="error"]{background:#ce9292}
@media(max-width:480px){.dashboard{padding:12px;border-radius:16px}.calendar-head{margin-bottom:16px;padding:0 10px}.navigation{gap:4px}.month{font-size:16px;min-width:175px}.nav{width:25px}.calendar,.weekdays{gap:5px}.day{aspect-ratio:1;min-height:34px;border-radius:7px;padding:6px;font-size:12px}.weekday{font-size:10px}.weekdays{margin-bottom:9px}.sync-dot{width:6px;height:6px}}
@media(prefers-reduced-motion:no-preference){.day{transition:background-color .25s ease}}
</style></head><body><main class="dashboard">
<div class="calendar-head"><div class="navigation"><button class="nav" id="previous" aria-label="Предыдущий месяц">‹</button><button class="month" id="this-month" title="Вернуться к текущему месяцу">Календарь</button><button class="nav" id="next" aria-label="Следующий месяц">›</button></div><span id="sync-status" class="sync-dot" role="status" tabindex="0" aria-label="Загрузка"></span></div>
<div class="weekdays" aria-hidden="true"><span class="weekday">ПН</span><span class="weekday">ВТ</span><span class="weekday">СР</span><span class="weekday">ЧТ</span><span class="weekday">ПТ</span><span class="weekday">СБ</span><span class="weekday">ВС</span></div><div class="calendar" id="calendar" aria-label="Календарь привычек"></div>
</main><script src="habits-metrics.js?v=monthly-v1"></script><script src="habits-sync.js?v=single-row-v1"></script><script>
const M=HabitMetrics,$=id=>document.getElementById(id);let current=null,monthKey=null;
// Daily completion contributes three levels; weekly activity adds up to two.
// Adding new weekly goals never dilutes a day's existing achievement.
function colorLevel(d){if(!d.known)return 0;const base=d.total?(d.count>=d.total?3:d.count/d.total>=.4?2:d.count?1:0):0;return Math.min(5,base+Math.min(2,d.weeklyDone.length));}
function render(value){current=value;HabitsSync.renderStatus($('sync-status'),value);if(!value.data)return;const data=value.data;monthKey||=data.today.slice(0,7);const start=M.date(monthKey+'-01');const label=start.toLocaleDateString('ru-RU',{month:'long',year:'numeric',timeZone:'UTC'});$('this-month').textContent=label[0].toUpperCase()+label.slice(1);const grid=$('calendar');grid.replaceChildren();for(let i=0;i<(start.getUTCDay()+6)%7;i++){const blank=document.createElement('div');blank.setAttribute('aria-hidden','true');grid.append(blank);}const last=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();for(let i=1;i<=last;i++){const key=monthKey+'-'+String(i).padStart(2,'0'),d=M.day(data,key),cell=document.createElement('div');cell.className='day'+(d.status==='future'?' future':!d.known?' unknown':'')+(key===data.today?' current':'');cell.dataset.date=key;cell.dataset.level=colorLevel(d);cell.textContent=i;cell.setAttribute('role','img');const status=d.status==='future'?'Будущий день':!d.known?'Нет данных':d.count+' из '+d.total+' ежедневных; недельных выполнено: '+d.weeklyDone.length;cell.setAttribute('aria-label',i+' '+label+' · '+status);cell.title=i+' '+label+' · '+status;grid.append(cell);}}
function moveMonth(delta){if(!current?.data)return;const date=M.date(monthKey+'-01');date.setUTCMonth(date.getUTCMonth()+delta);monthKey=M.iso(date).slice(0,7);render(current);}
$('previous').onclick=()=>moveMonth(-1);$('next').onclick=()=>moveMonth(1);$('this-month').onclick=()=>{if(current?.data){monthKey=current.data.today.slice(0,7);render(current);}};HabitsSync.subscribe(render);HabitsSync.start();
</script></body></html>
