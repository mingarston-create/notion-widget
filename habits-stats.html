*{box-sizing:border-box}body{margin:0;padding:6px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{cursor:default;opacity:.35}.dashboard{max-width:1280px;margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:26px}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;font-weight:700}.header{display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:26px;letter-spacing:-.8px;margin:5px 0 0;font-weight:700}h2{font-size:15px;margin:0}p{margin:0}.sync{font-size:11px;color:var(--muted);max-width:270px;text-align:right;line-height:1.5}.sync:before{content:'●';color:var(--green);margin-right:6px}.sync.error:before{color:var(--amber)}.intro{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.kpi{border:1px solid var(--line);border-radius:15px;padding:15px;background:var(--tile)}.kpi-label{font-size:11px;color:var(--muted)}.kpi-value{font-size:26px;letter-spacing:-1px;font-weight:700;margin:8px 0 5px}.kpi-note{font-size:10px;color:var(--muted);line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(240px,1fr);gap:24px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.month-label{font-size:19px;font-weight:650;text-transform:capitalize;letter-spacing:-.4px}.navigation{display:flex;gap:6px;align-items:center}.nav{border:1px solid var(--line);background:var(--bg);height:32px;min-width:32px;border-radius:9px;font-size:17px}.nav.today-button{font-size:11px;padding:0 10px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.weekdays{margin-bottom:8px}.weekday{text-align:center;color:var(--muted);font-size:10px;font-weight:600}.day{position:relative;border:1px solid transparent;border-radius:12px;min-height:70px;padding:10px;background:var(--tile);text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .12s,box-shadow .12s}.day:not(:disabled):hover{transform:translateY(-2px)}.day.selected{outline:2px solid var(--ink);outline-offset:2px}.day-number{font-size:13px;font-weight:650}.day-count{font-size:10px;letter-spacing:.01em}.day.full{background:var(--green-soft);color:var(--green)}.day.zero{background:var(--red-soft);color:var(--red)}.day.partial{background:var(--amber-soft);color:var(--amber)}.day.partial.high{background:#e7eed4;color:#637d26}.day.today{background:var(--blue-soft);color:var(--blue);border:1px dashed var(--blue)}.day.current .day-number:after{content:'•';margin-left:5px;color:currentColor}.day.future{opacity:.45}.day.unknown,.day.no-plan{color:var(--muted)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0 0;font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}.swatch{height:8px;width:8px;border-radius:3px;background:var(--tile)}.legend-note{font-size:10px;color:var(--muted);line-height:1.6;margin-top:10px}.details{padding:18px;border-radius:17px;border:1px solid var(--line);background:var(--tile);align-self:start}.detail-date{font-size:17px;margin:5px 0 8px;font-weight:650}.detail-state{font-size:12px;color:var(--muted);line-height:1.5}.detail-list{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:12px}.detail-list li{display:flex;align-items:center;gap:8px;font-size:12px;line-height:1.4}.check{height:18px;width:18px;flex:0 0 18px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--muted)}.check.done{background:var(--green-soft);color:var(--green);border-color:transparent}.detail-weekly{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-t /* Compact calendar: use width before adding height. */
.dashboard{max-width:1600px;padding:18px;border-radius:20px}

@media(max-width:480px){.dashboard{padding:12px}.intro{font-size:10px}h1{font-size:21px}.calendar-head{margin-bottom:10px}.calendar,.weekdays{gap:5px}.day{padding:6px 4px;min-height:46px}.day-count{font-size:8px;letter-spacing:-.2px}.day-number{font-size:12px}.kpis{margin:0;gap:6px}.kpi{padding:8px 10px}.kpi-value{font-size:21px}.kpi-label{font-size:10px}.kpi-note{font-size:9px}.weekly-grid{grid-template-columns:1fr}.weekly-head{flex-direction:row}.detail-list{grid-template-columns:1fr}.footer{font-size:9px;gap:6px}.month-label{font-size:16px}.nav.today-button{padding:0 7px}}
.layout{display:block;margin-top:0}.dashboard{max-width:none;padding:14px}.month-label{text-transform:none}.month-title{display:flex;align-items:center;min-width:0}.calendar-head{margin-bottom:12px}.week-inline{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center;padding:4px 2px 8px;color:var(--muted);font-size:11px;line-height:1.5;border-bottom:1px solid var(--line);margin-bottom:2px}.week-inline:last-child{border-bottom:0;padding-bottom:0}.week-caption{font-size:10px}.week-item.done{color:var(--green)}.details{margin-top:12px}.day{min-height:46px}.day-count{font-size:10px}.day-number{font-size:13px}
@media(max-width:480px){.dashboard{padding:10px}.month-label{font-size:16px}.week-inline{font-size:10px;gap:3px 10px;padding-bottom:6px}.week-caption{font-size:9px}.day{min-height:44px;padding:5px 3px}.day-count{font-size:8px}.navigation{gap:4px}.nav{min-width:28px}.nav.today-button{padding:0 5px}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:22px;align-items:start}.layout>section{min-width:0}.day{min-height:62px;gap:3px;padding:7px 9px}.day-number,.day-count{padding-left:3px}.day-icons{display:flex;flex-wrap:wrap;gap:2px;font-size:13px;line-height:16px;min-height:16px}.progress-panel{min-width:0;text-align:center}.progress-date{font-size:11px;color:var(--muted);margin:0 0 12px}.rings{display:grid;gap:16px}.progress-item{min-width:0}.ring{--progress:0%;width:90px;height:90px;margin:auto;border-radius:50%;background:conic-gradient(var(--green) var(--progress),var(--line) 0);display:grid;place-items:center;position:relative}.ring:before{content:'';position:absolute;inset:7px;background:var(--bg);border-radius:50%}.ring>span{position:relative;font-weight:700;font-size:20px}.ring-label{font-size:12px;margin-top:6px;line-height:1.3}.ring-count{font-size:11px;color:var(--muted);margin-top:3px}.details{grid-column:1/-1}
@media(max-width:700px){.layout{grid-template-columns:minmax(0,1fr);gap:14px}.rings{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.progress-date{margin-bottom:8px}.ring{width:76px;height:76px}.ring-label{font-size:11px}.day{padding:6px 4px}.day-number,.day-count{padding-left:3px}.day-icons{font-size:11px;line-height:14px;min-height:14px}.ring>span{font-size:18px}}
.calendar-head{flex-wrap:wrap}.nav.today-button{min-width:100px;padding:0 12px}.navigation{flex-shrink:0}@media(max-width:360px){.navigation{margin-left:auto}}
</style>
</head>
<body>
<main class="dashboard">

<div class="layout"><section aria-label="Месячный календарь"><div class="calendar-head"><div class="month-title"><h2 class="month-label" id="month-label">Календарь</h2><span id="sync-status" class="sync-dot" role="status" tabindex="0" aria-label="Загрузка"></span></div><div class="navigation"><button class="nav" id="previous" aria-label="Предыдущий месяц">‹</button><button class="nav today-button" id="this-month" aria-label="Вернуться к текущему месяцу">Месяц</button><button class="nav" id="next" aria-label="Следующий месяц">›</button></div></div>
<div class="weekdays" aria-hidden="true"><span class="weekday">ПН</span><span class="weekday">ВТ</span><span class="weekday">СР</span><span class="weekday">ЧТ</span><span class="weekday">ПТ</span><span class="weekday">СБ</span><span class="weekday">ВС</span></div>
<div class="calendar" id="calendar"></div>
</section>
<aside class="progress-panel" aria-label="Прогресс выбранного дня и недели"><p id="progress-date" class="progress-date"></p><div class="rings"><div class="progress-item"><div class="ring" id="ring-day" role="progressbar" aria-label="День" aria-valuemin="0" aria-valuemax="100"><span id="ring-day-value">—</span></div><div class="ring-label">День</div><div class="ring-count" id="ring-day-count">—</div></div><div class="progress-item"><div class="ring" id="ring-week" role="progressbar" aria-label="Неделя" aria-valuemin="0" aria-valuemax="100"><span id="ring-week-value">—</span></div><div class="ring-label">Неделя</div><div class="ring-count" id="ring-week-count">—</div></div><div class="progress-item"><div class="ring" id="ring-weekly" role="progressbar" aria-label="Недельные привычки" aria-valuemin="0" aria-valuemax="100"><span id="ring-weekly-value">—</span></div><div class="ring-label">Недельные привычки</div><div class="ring-count" id="ring-weekly-count">—</div></div></div></aside><aside class="details" id="details" aria-live="polite"><div class="eyebrow">Детали дня</div><h2 class="detail-date" id="detail-date">—</h2><p class="detail-state" id="detail-state">Загружаем историю</p><ul class="detail-list" id="detail-list"></ul><p class="detail-weekly" id="detail-weekly"></p></aside></div>

</main>
<script src="habits-metrics.js?v=monthly-v1"></script><script src="habits-sync.js?v=single-row-v1"></script>
<script>
let current=null,monthKey=null,selected=null,detailsOpened=false;
const $=id=>document.getElementById(id),M=HabitMetrics;
function name(data,id){const h=data.catalog?.[id]||data.habits[id];return h?h.icon+' '+h.title:'Привычка из истории';}
function format(key,options){return M.date(key).toLocaleDateString('ru-RU',{timeZone:'UTC',...options});}
function ring(id,count,total,known){const el=$('ring-'+id),pct=known&&total?Math.min(100,Math.round(count*100/total)):null;el.style.setProperty('--progress',(pct||0)+'%');$('ring-'+id+'-value').textContent=pct===null?'—':pct+'%';$('ring-'+id+'-count').textContent=known&&total?count+' / '+total:'Нет данных';if(pct===null)el.removeAttribute('aria-valuenow');else el.setAttribute('aria-valuenow',pct);el.setAttribute('aria-valuetext',pct===null?'Нет данных':pct+'%, '+count+' из '+total);}
function render(value){current=value;HabitsSync.renderStatus($('sync-status'),value);if(!value.data)return;
const data=value.data;if(!monthKey)monthKey=data.today.slice(0,7);if(!selected)selected=data.today;
const currentMonth=format(data.today,{month:'long'});$('this-month').textContent=currentMonth.charAt(0).toUpperCase()+currentMonth.slice(1);
const label=format(monthKey+'-01',{month:'long',year:'numeric'});$('month-label').textContent=label.charAt(0).toUpperCase()+label.slice(1);
$('next').disabled=false;$('previous').disabled=false;
const start=M.date(monthKey+'-01'),last=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)),grid=$('calendar');grid.replaceChildren();for(let i=0;i<(start.getUTCDay()+6)%7;i++){const blank=document.createElement('div');blank.setAttribute('aria-hidden','true');grid.append(blank);}
for(let i=1;i<=last.getUTCDate();i++){const key=monthKey+'-'+String(i).padStart(2,'0'),d=M.day(data,key),button=document.createElement('button');button.type='button';button.className='day '+d.status+(d.status==='partial'&&d.ratio>=.6?' high':'')+(key===data.today?' current':'')+(key===selected?' selected':'');button.dataset.date=key;button.dataset.status=d.status;button.disabled=d.status==='future';button.setAttribute('aria-pressed',String(key===selected));const n=document.createElement('span');n.className='day-number';n.textContent=i;const count=document.createElement('span');count.className='day-count';count.textContent=d.status==='future'?'':!d.known?'нет данных':!d.total?'нет плана':d.count+' / '+d.total;button.append(n,count);const icons=document.createElement('span');icons.className='day-icons';for(const id of d.weeklyDone){const icon=document.createElement('span');icon.textContent=(data.catalog?.[id]||data.habits[id])?.icon||'✓';icon.title=name(data,id);icon.setAttribute('aria-label',name(data,id));icons.append(icon);}button.append(icons);button.setAttribute('aria-label',format(key,{day:'numeric',month:'long'})+' · '+(d.status==='future'?'будущий день':count.textContent));button.onclick=()=>{selected=key;detailsOpened=true;render(current);};grid.append(button);
}

const detail=M.day(data,selected);const week=M.week(data,selected);let weekDone=0,weekTotal=0;for(const key of Object.keys(data.stats.history)){if(key<week.first||key>week.last||key>data.today)continue;const d=M.day(data,key);weekDone+=d.count;weekTotal+=d.total;}ring('day',detail.count,detail.total,detail.known);ring('week',weekDone,weekTotal,week.known);ring('weekly',week.done,week.total,week.known);$('progress-date').textContent=format(selected,{day:'numeric',month:'long'});$('ring-week').title='Ежедневные привычки за сохранённые дни недели, включая выбранную неделю целиком до сегодня';
$('details').classList.toggle('open',detailsOpened);$('detail-date').textContent=format(selected,{day:'numeric',month:'long',weekday:'short'});$('detail-state').textContent=!detail.known?'За этот день нет данных':!detail.total?'На этот день нет ежедневного плана':detail.status==='full'?'Все ежедневные выполнены. Отличный день!':detail.status==='zero'?'Ежедневных выполнений не было':detail.status==='today'?'День ещё идёт. Можно начать с одной привычки.':detail.count+' из '+detail.total+' ежедневных выполнено';const list=$('detail-list');list.replaceChildren();if(detail.known)for(const id of detail.ids){const item=document.createElement('li'),check=document.createElement('span');check.className='check'+(detail.done.includes(id)?' done':'');check.textContent=detail.done.includes(id)?'✓':'·';const label=document.createElement('span');label.textContent=name(data,id);item.append(check,label);list.append(item);} $('detail-weekly').textContent=detail.weeklyDone.length?'Отдельно, в недельный план: '+detail.weeklyDone.map(id=>name(data,id)).join(', '):'Недельные привычки не входят в оценку этого дня.';

}
function moveMonth(delta){if(!current?.data)return;const d=M.date(monthKey+'-01');d.setUTCMonth(d.getUTCMonth()+delta);monthKey=M.iso(d).slice(0,7);detailsOpened=false;const end=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0));selected=monthKey===current.data.today.slice(0,7)?current.data.today:M.iso(end);render(current);}
$('previous').onclick=()=>moveMonth(-1);$('next').onclick=()=>moveMonth(1);$('this-month').onclick=()=>{if(!current?.data)return;monthKey=current.data.today.slice(0,7);selected=current.data.today;render(current);};HabitsSync.subscribe(render);HabitsSync.start();
</script></body></html>
